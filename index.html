<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="秉軒老師的 PDF 工具箱：合併、分割、壓縮、OCR、Office 與 PDF 互轉、簽名、加密、遮蔽、比較與 AI 摘要翻譯，大多數工具只在你的瀏覽器裡處理檔案。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<title>秉軒老師的 PDF 工具箱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: light, airy brand world (CIS 60/30/10). Mist-violet hero band with 37° rhythm lines,
   a tool grid of rounded single-line icons, and a two-column workspace (canvas + options) per tool.
   Single light theme on purpose: the brand book asks for bright, light pages and rules out dark tech looks. */
:root {
  --purple: #603E8D;      /* 效能紫：主色、標題、線條 */
  --purple-80: #806599;
  --purple-20: #DFD8E8;
  --yellow: #FFC94A;      /* 火花黃：唯一的行動按鈕 */
  --teal: #36C2B4;        /* 清新青：上升勾、完成狀態 */
  --mist: #EFEAF7;        /* 晨霧紫：大面積底色 */
  --ink: #2E2640;         /* 墨紫：內文 */
  --white: #FFFFFF;       /* 雲白 */
  --muted: #615878;
  --line: #E3DCEE;
  --danger: #B3364A;
  --danger-bg: #FBEDEF;

  --font-latin: "Nunito", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-body: "Nunito", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;

  --radius: 14px;
  --radius-sm: 10px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--white); color: var(--ink); }
body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--white); }
h1, h2, h3 { color: var(--purple); text-wrap: balance; letter-spacing: .03em; line-height: 1.35; margin: 0; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--purple); }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.num { font-family: var(--font-latin); font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--white) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.site-header .wrap { display: flex; align-items: center; gap: 24px; min-height: 68px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--purple); flex-shrink: 0; }
.brand svg { width: 40px; height: 40px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text b { font-size: 17px; letter-spacing: .04em; }
.brand-text small { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.main-nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.avatar { position: relative; display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; padding: 4px 0; }
.avatar-label { font-size: 13px; font-weight: 700; color: var(--purple); line-height: 1.3; text-align: right; }
.avatar-frame { position: relative; width: 60px; height: 60px; border-radius: 50%; overflow: hidden; display: block; background: var(--mist); }
.avatar-frame img, .avatar-frame svg { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.avatar-arc { position: absolute; right: -6px; top: -2px; width: 72px; height: 72px; pointer-events: none; transition: transform .3s; }
.avatar-spark { position: absolute; right: -6px; top: -2px; width: 14px; height: 14px; }
.avatar:hover .avatar-arc { transform: rotate(-20deg); }
@media (prefers-reduced-motion: reduce) { .avatar-arc { transition: none; } }
.main-nav a {
  text-decoration: none; color: var(--ink); font-size: 15px; font-weight: 500;
  padding: 6px 14px; border-radius: 999px;
}
.main-nav a:hover { background: var(--mist); color: var(--purple); }
.menu-btn, .nav-contact { display: none; }
@media (max-width: 720px) {
  .avatar { display: none; }
  .menu-btn { display: grid; place-items: center; margin-left: auto; width: 44px; height: 44px; border: 0; border-radius: 12px; background: var(--mist); color: var(--purple); cursor: pointer; }
  .menu-btn svg { width: 24px; height: 24px; }
  .menu-btn .i-close, .site-header.open .menu-btn .i-open { display: none; }
  .site-header.open .menu-btn .i-close { display: block; }
  .main-nav {
    display: none; position: absolute; top: 100%; left: 0; right: 0; margin: 0;
    flex-direction: column; flex-wrap: nowrap; gap: 2px; background: var(--white);
    padding: 8px var(--gutter-r) 18px var(--gutter-l); border-bottom: 1px solid var(--line);
    box-shadow: 0 18px 30px -20px rgba(46, 38, 64, .45); max-height: calc(100vh - 80px); overflow-y: auto;
  }
  .site-header.open .main-nav { display: flex; }
  .main-nav a { font-size: 17px; padding: 12px 12px; border-radius: 10px; }
  .main-nav a.nav-contact {
    display: flex; align-items: center; gap: 14px; margin-top: 10px; padding: 14px;
    background: var(--mist); border-radius: var(--radius);
  }
  .nav-contact .nc-img { position: relative; width: 56px; height: 56px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--white); box-shadow: 0 0 0 2px var(--white), 0 0 0 3.2px var(--purple-80); }
  .nav-contact .nc-img img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
  .nav-contact b { display: block; color: var(--purple); font-size: 17px; }
  .nav-contact small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; line-height: 1.5; }
}

/* ---------- hero ---------- */
.hero { background: var(--mist); position: relative; overflow: hidden; }
.hero .wrap { position: relative; padding-block: 56px 48px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: center; }
.hero h1 { font-size: clamp(30px, 4.4vw, 44px); }
.hero h1 .accent { color: var(--ink); }
.hero p.lead { margin-top: 14px; font-size: 18px; max-width: 34em; color: var(--ink); }
.hero-facts { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 22px; font-size: 15px; color: var(--muted); }
.hero-facts span { display: inline-flex; align-items: center; gap: 8px; }
.hero-facts svg { width: 18px; height: 18px; flex-shrink: 0; }
.flow { display: flex; align-items: flex-start; gap: 6px; list-style: none; margin: 0; padding: 0; counter-reset: f; }
.flow li { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 96px; text-align: center; }
.flow .disc { position: relative; width: 84px; height: 84px; border-radius: 50%; background: var(--white); display: grid; place-items: center; box-shadow: 0 6px 18px -12px rgba(96, 62, 141, .6); }
.flow .disc svg { width: 40px; height: 40px; }
.flow .disc::before { counter-increment: f; content: counter(f); position: absolute; top: -4px; left: -4px; width: 26px; height: 26px; border-radius: 50%; background: var(--purple); color: var(--white); font: 800 14px/26px var(--font-latin); }
.flow li:last-child .disc::before { background: var(--yellow); color: var(--ink); }
.flow b { font-size: 15px; color: var(--purple); letter-spacing: .04em; }
.flow .arrow { width: 34px; height: 84px; display: grid; place-items: center; }
.flow .arrow svg { width: 30px; height: 30px; }
.rhythm { position: absolute; right: -40px; bottom: -30px; width: 420px; height: 220px; pointer-events: none; opacity: .5; }
@media (max-width: 760px) {
  .hero .wrap { grid-template-columns: 1fr; padding-block: 36px 32px; }
  .flow { justify-content: center; }
  .flow li { width: 84px; }
  .flow .disc { width: 68px; height: 68px; }
  .flow .disc svg { width: 32px; height: 32px; }
  .flow .arrow { width: 22px; height: 68px; }
}

/* ---------- tool grid ---------- */
.tools-section { padding-block: 48px 64px; }
.group { margin-top: 36px; }
.group:first-child { margin-top: 0; }
.group-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 16px; }
.group-head h2 { font-size: 22px; }
.group-head p { color: var(--muted); font-size: 15px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.tool-card {
  display: flex; flex-direction: column; gap: 10px; text-align: left;
  padding: 20px 20px 22px; border: 1.5px solid var(--line); border-radius: var(--radius);
  background: var(--white); text-decoration: none; color: var(--ink);
  transition: border-color .15s, transform .15s, box-shadow .15s;
  position: relative;
}
.tool-card:hover { border-color: var(--purple); transform: translateY(-2px); box-shadow: 0 8px 22px -14px rgba(96, 62, 141, .55); }
.tool-card .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--mist); display: grid; place-items: center; }
.tool-card .ico svg { width: 26px; height: 26px; }
.tool-card h3 { font-size: 17px; }
.tool-card p { font-size: 14px; color: var(--muted); line-height: 1.6; }
.pill {
  position: absolute; top: 16px; right: 16px; font-size: 12px; font-weight: 600; letter-spacing: .06em;
  padding: 2px 10px; border-radius: 999px; background: var(--mist); color: var(--purple);
}

/* ---------- training referral ---------- */
.services { background: var(--mist); padding-block: 36px 40px; }
.services-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
.services-head h2 { font-size: 22px; }
.services-head p { color: var(--muted); font-size: 15px; margin-top: 2px; }
.btn-primary.btn-sm { padding: 9px 20px; font-size: 15px; }
.asks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; }
.asks a { height: 100%; display: flex; flex-direction: column; gap: 6px; background: var(--white); border-radius: var(--radius); padding: 16px; text-decoration: none; color: var(--ink); border: 1.5px solid transparent; transition: border-color .15s; }
.asks a:hover { border-color: var(--purple); }
.asks .if { font-size: 12px; font-weight: 700; color: var(--teal); letter-spacing: .08em; }
.asks .q { font-size: 15px; font-weight: 600; line-height: 1.55; }
.asks .topic { margin-top: auto; padding-top: 6px; font-size: 13px; color: var(--purple); font-weight: 700; }
@media (max-width: 1000px) { .asks { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .asks { grid-template-columns: 1fr; } }

/* ---------- footer ---------- */
.site-footer { background: var(--purple); color: var(--white); }
.site-footer .wrap { padding-block: 28px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 32px; align-items: center; font-size: 14px; }
.site-footer .slogan b { display: block; font-size: 17px; letter-spacing: .04em; }
.site-footer .slogan span { color: var(--yellow); font-family: var(--font-latin); font-weight: 600; }
.site-footer small { color: var(--purple-20); }

/* ---------- tool view ---------- */
.tool-view { padding-block: 32px 64px; }
.crumb { font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.crumb:hover { color: var(--purple); }
.tool-head { display: flex; gap: 16px; align-items: center; margin: 14px 0 26px; }
.tool-head .ico { width: 56px; height: 56px; border-radius: 16px; background: var(--mist); display: grid; place-items: center; flex-shrink: 0; }
.tool-head .ico svg { width: 32px; height: 32px; }
.tool-head h1 { font-size: clamp(26px, 3.4vw, 34px); }
.tool-head p { color: var(--muted); margin-top: 2px; }

.drop {
  position: relative; border: 2px dashed var(--purple-80); border-radius: 22px;
  background: var(--mist); padding: 56px 24px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  transition: background .15s, border-color .15s;
}
.drop.over { background: var(--purple-20); border-color: var(--purple); }
.drop svg.big { width: 76px; height: 76px; }
.drop h2 { font-size: 22px; }
.drop p { color: var(--muted); font-size: 15px; }
.drop .hint { font-size: 13px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 999px; padding: 12px 26px; font-size: 16px; font-weight: 700;
  cursor: pointer; text-decoration: none; letter-spacing: .03em; transition: transform .12s, box-shadow .12s, background .12s;
}
.btn-primary { background: var(--yellow); color: var(--ink); box-shadow: 0 6px 16px -8px rgba(204, 150, 20, .8); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -10px rgba(204, 150, 20, .9); }
.btn-primary:disabled { background: var(--purple-20); color: var(--muted); box-shadow: none; cursor: not-allowed; transform: none; }
.btn-secondary { background: var(--white); color: var(--purple); border: 1.5px solid var(--purple); padding: 10.5px 22px; }
.btn-secondary:hover { background: var(--mist); }
.btn-ghost { background: transparent; color: var(--purple); padding: 8px 14px; font-weight: 600; font-size: 15px; }
.btn-ghost:hover { background: var(--mist); }
.btn-block { width: 100%; }
.btn-sm { padding: 6px 14px; font-size: 14px; }

.work { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
@media (max-width: 900px) { .work { grid-template-columns: 1fr; } }
.canvas { min-width: 0; }
.canvas-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; }
.canvas-bar .info { color: var(--muted); font-size: 14px; margin-right: auto; }
.panel {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 88px);
  border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--white); padding: 22px;
  display: flex; flex-direction: column; gap: 18px;
}
@media (max-width: 900px) { .panel { position: static; } }
.panel h2 { font-size: 18px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .label { font-weight: 600; font-size: 14px; color: var(--ink); }
.field .help { font-size: 13px; color: var(--muted); line-height: 1.55; }
.field input[type="text"], .field input[type="number"], .field input[type="password"], .field select, .field textarea {
  font: inherit; font-size: 15px; color: var(--ink); background: var(--white);
  border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 9px 12px; width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--purple); }
.field input[type="range"] { accent-color: var(--purple); width: 100%; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--mist); padding: 4px; border-radius: 12px; }
.seg label { position: relative; text-align: center; font-size: 14px; padding: 7px 6px; border-radius: 9px; cursor: pointer; line-height: 1.35; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--white); color: var(--purple); font-weight: 700; box-shadow: 0 1px 4px rgba(46, 38, 64, .12); }
.seg label:has(input:focus-visible) { outline: 3px solid var(--teal); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; }
.choice:has(input:checked) { border-color: var(--purple); background: var(--mist); }
.choice input { accent-color: var(--purple); margin-top: 5px; }
.choice b { display: block; font-size: 15px; color: var(--purple); }
.choice span { font-size: 13px; color: var(--muted); line-height: 1.5; }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; cursor: pointer; }
.check input { accent-color: var(--purple); width: 18px; height: 18px; }
.swatches { display: flex; gap: 10px; }
.swatches label { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid var(--white); box-shadow: 0 0 0 1.5px var(--line); position: relative; }
.swatches input { position: absolute; opacity: 0; }
.swatches label:has(input:checked) { box-shadow: 0 0 0 2.5px var(--purple); }
.swatches label:has(input:focus-visible) { outline: 3px solid var(--teal); outline-offset: 3px; }
.posgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 132px; padding: 8px; background: var(--mist); border-radius: 10px; aspect-ratio: 210/297; max-width: 100%; align-content: space-between; }
.posgrid label { height: 26px; border-radius: 6px; cursor: pointer; position: relative; display: grid; place-items: center; }
.posgrid label::after { content: ""; width: 14px; height: 6px; border-radius: 3px; background: var(--purple-20); }
.posgrid input { position: absolute; opacity: 0; }
.posgrid label:has(input:checked)::after { background: var(--purple); }
.posgrid label:has(input:focus-visible) { outline: 3px solid var(--teal); }
.posgrid .gap { grid-column: span 3; height: 0; }

/* file list (merge / images) */
.files { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.fcard {
  position: relative; border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--white);
  padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 8px; cursor: grab;
}
.fcard.dragging { opacity: .4; }
.fcard.drop-before { box-shadow: -4px 0 0 0 var(--teal); }
.fcard .thumb { aspect-ratio: 3/4; background: var(--mist); border-radius: 8px; display: grid; place-items: center; overflow: hidden; max-width: 100%; }
.fcard .thumb img, .fcard .thumb canvas { max-width: 100%; max-height: 100%; box-shadow: 0 1px 4px rgba(46, 38, 64, .18); background: #fff; }
.fcard .name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fcard .meta { font-size: 12px; color: var(--muted); }
.fcard .order { position: absolute; top: 6px; left: 6px; min-width: 24px; height: 24px; border-radius: 12px; background: var(--purple); color: var(--white); font-size: 12px; font-weight: 800; display: grid; place-items: center; padding: 0 6px; font-family: var(--font-latin); }
.fcard .acts { display: flex; gap: 2px; justify-content: flex-end; }
.icon-btn { border: 0; background: transparent; border-radius: 8px; width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; color: var(--purple); }
.icon-btn:hover { background: var(--mist); }
.icon-btn svg { width: 18px; height: 18px; }
.add-tile { border: 2px dashed var(--purple-20); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--purple); font-weight: 600; font-size: 14px; cursor: pointer; background: transparent; min-height: 200px; }
.add-tile:hover { border-color: var(--purple); background: var(--mist); }
.add-tile svg { width: 28px; height: 28px; }

/* page grid */
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 14px; }
.pcard { position: relative; border: 2px solid transparent; border-radius: 12px; padding: 8px; background: var(--white); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: border-color .12s, background .12s; }
.pcard:hover { background: var(--mist); }
.pcard .thumb { width: 100%; aspect-ratio: 3/4; display: grid; place-items: center; }
.pcard .thumb canvas { max-width: 100%; max-height: 100%; box-shadow: 0 1px 5px rgba(46, 38, 64, .2); background: #fff; transition: transform .2s; }
.pcard .pn { font-size: 13px; color: var(--muted); font-family: var(--font-latin); font-weight: 600; }
.pcard.sel-remove { border-color: var(--danger); background: var(--danger-bg); }
.pcard.sel-remove canvas { opacity: .35; }
.pcard.sel-keep { border-color: var(--teal); background: #E9F8F6; }
.pcard .badge { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; display: none; place-items: center; color: var(--white); }
.pcard .badge svg { width: 16px; height: 16px; }
.pcard.sel-remove .badge { display: grid; background: var(--danger); }
.pcard.sel-keep .badge { display: grid; background: var(--teal); }
.pcard .acts { display: flex; gap: 2px; }
.pcard.dragging { opacity: .4; }
.pcard.drop-before { box-shadow: -4px 0 0 0 var(--teal); }
.placeholder-page { width: 70%; aspect-ratio: 210/297; background: var(--mist); border-radius: 4px; }

/* text preview */
.textprev { width: 100%; min-height: 320px; font: 14px/1.7 var(--font-body); color: var(--ink); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 16px; resize: vertical; background: var(--white); }

/* processing + result */
.overlay { position: fixed; inset: 0; background: rgba(46, 38, 64, .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.overlay-card { background: var(--white); border-radius: 22px; padding: 32px 28px; width: min(420px, 100%); text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.overlay-card h2 { font-size: 20px; }
.overlay-card p { color: var(--muted); font-size: 15px; }
.bar { width: 100%; height: 10px; background: var(--mist); border-radius: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--purple); border-radius: 5px; transition: width .2s; }
.spin { width: 64px; height: 64px; }
.spin .arc { transform-origin: 32px 32px; animation: rot 1.1s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin .arc { animation: none; } .tool-card, .btn { transition: none; } }

.result { max-width: 640px; margin: 8px auto 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.result .ok { width: 96px; height: 96px; }
.result h2 { font-size: 28px; }
.result .stats { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 15px; color: var(--muted); }
.result .stats b { color: var(--ink); }
.result .saving { background: #E9F8F6; color: #1D6E66; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.result .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.next { margin-top: 28px; width: 100%; text-align: left; }
.next h3 { font-size: 16px; margin-bottom: 10px; }
.next .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.next .tool-card { padding: 14px; flex-direction: row; align-items: center; gap: 12px; }
.next .tool-card .ico { width: 36px; height: 36px; flex-shrink: 0; }
.next .tool-card .ico svg { width: 22px; height: 22px; }
.next .tool-card h3 { font-size: 15px; }

/* camera */
.cam-card { background: var(--ink); border-radius: 22px; padding: 12px; width: min(760px, 100%); display: flex; flex-direction: column; gap: 12px; }
.cam-card video { width: 100%; max-height: 70vh; border-radius: 14px; background: #000; transition: opacity .12s; object-fit: contain; }
.cam-bar { display: flex; gap: 10px; align-items: center; justify-content: flex-end; color: var(--white); font-size: 14px; }
.cam-bar span { margin-right: auto; }

/* page editor */
.ed-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 6px; border: 1.5px solid var(--line); border-radius: 14px; margin-bottom: 12px; background: var(--white); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); z-index: 5; }
.ed-tool { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 7px 10px; border-radius: 10px; cursor: pointer; font-size: 14px; color: var(--ink); }
.ed-tool svg { width: 18px; height: 18px; }
.ed-tool:hover { background: var(--mist); }
.ed-tool[aria-pressed="true"] { background: var(--purple); color: var(--white); }
.ed-tool[aria-pressed="true"] svg { stroke: var(--white); }
.ed-tool:disabled { opacity: .4; cursor: default; background: transparent; }
.ed-sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }
.ed-colors { display: flex; gap: 6px; padding: 0 4px; }
.ed-colors label { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; box-shadow: 0 0 0 1.5px var(--line); position: relative; }
.ed-colors input { position: absolute; opacity: 0; }
.ed-colors label:has(input:checked) { box-shadow: 0 0 0 2.5px var(--purple); }
.ed-size { font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
.ed-size select, .ed-pg select { font: inherit; font-size: 14px; border: 1.5px solid var(--line); border-radius: 8px; padding: 3px 6px; background: var(--white); color: var(--ink); }
.ed-pg { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
.ed-wrap { background: var(--mist); border-radius: var(--radius); padding: 16px; overflow: auto; min-height: 320px; display: flex; justify-content: center; align-items: flex-start; }
.ed-page { position: relative; box-shadow: 0 4px 18px -8px rgba(46, 38, 64, .45); background: #fff; flex-shrink: 0; }
.ed-page canvas { display: block; }
.ed-layer { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: default; }
.ed-layer[data-tool="text"] { cursor: text; }
.ed-layer[data-tool="rect"], .ed-layer[data-tool="hl"], .ed-layer[data-tool="redact"], .ed-layer[data-tool="draw"], .ed-layer[data-tool="sig"] { cursor: crosshair; }
.ed-item { position: absolute; cursor: move; touch-action: none; }
.ed-item.sel { outline: 1.5px dashed var(--purple); outline-offset: 2px; }
.ed-item img { width: 100%; height: 100%; display: block; pointer-events: none; user-select: none; }
.ed-txt { white-space: pre-wrap; min-width: 1em; font-family: "Noto Sans TC", "Nunito", "PingFang TC", "Microsoft JhengHei", sans-serif; outline: none; width: max-content; max-width: 100%; }
.ed-text { width: auto !important; min-width: 20px; }
.ed-txt[contenteditable="true"] { cursor: text; background: rgba(255, 255, 255, .6); }
.ed-h { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--white); border: 2px solid var(--purple); }
.ed-h[data-h="se"] { right: -8px; bottom: -8px; cursor: nwse-resize; }
.ed-h[data-h="nw"] { left: -8px; top: -8px; cursor: nwse-resize; }
.ed-h[data-h="ne"] { right: -8px; top: -8px; cursor: nesw-resize; }
.ed-h[data-h="sw"] { left: -8px; bottom: -8px; cursor: nesw-resize; }
.ed-x { position: absolute; right: -12px; top: -14px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--danger); color: #fff; font-size: 16px; line-height: 1; cursor: pointer; display: grid; place-items: center; }
.ed-crop { outline: 2px solid var(--purple) !important; box-shadow: 0 0 0 9999px rgba(46, 38, 64, .45); }
.ed-live { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.sig-choice { align-items: center; }
.sig-choice img { max-height: 44px; max-width: 170px; }
.sig-choice .icon-btn { margin-left: auto; }
.sig-card { background: var(--white); border-radius: 22px; padding: 24px; width: min(600px, 100%); display: flex; flex-direction: column; gap: 14px; max-height: calc(100vh - 32px); overflow: auto; }
.sig-card h2 { font-size: 20px; }
.sig-pad { width: 100%; aspect-ratio: 1040/360; border: 2px dashed var(--purple-20); border-radius: 14px; touch-action: none; cursor: crosshair; background: #fff; }
.sig-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sig-row .help { font-size: 13px; color: var(--muted); margin-right: auto; }
.sig-card input[type="text"] { font: inherit; font-size: 16px; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; width: 100%; }
.sig-fonts { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.sig-fonts .choice { align-items: center; }
.sig-prev img { max-width: 100%; max-height: 120px; margin-top: 10px; }

/* forms */
.form-list { display: flex; flex-direction: column; gap: 14px; max-width: 640px; }
.form-page { font-size: 15px; color: var(--muted); margin-top: 8px; }
.form-field input[type="text"], .form-field textarea, .form-field select { font: inherit; font-size: 15px; color: var(--ink); border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 9px 12px; width: 100%; background: var(--white); }

/* markdown preview + compare */
.mdprev { width: 100%; text-align: left; border: 1.5px solid var(--line); border-radius: var(--radius); padding: 18px 22px; max-height: 520px; overflow: auto; background: var(--white); }
.mdprev h2, .mdprev h3, .mdprev h4 { margin: 14px 0 6px; }
.mdprev h2 { font-size: 20px; } .mdprev h3 { font-size: 17px; } .mdprev h4 { font-size: 15px; }
.mdprev p, .mdprev li { font-size: 15px; margin: 0 0 6px; }
.mdprev table { border-collapse: collapse; margin: 8px 0; font-size: 14px; }
.mdprev td, .mdprev th { border: 1px solid var(--line); padding: 4px 8px; }
.result.wide { max-width: 1100px; }
.cmp { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 12px; }
.cmp h3 { font-size: 17px; margin-top: 8px; }
.cmp-stats { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.df { border: 1.5px solid var(--line); border-radius: var(--radius); overflow: auto; max-height: 560px; font-size: 14px; line-height: 1.6; }
.df-row { display: grid; grid-template-columns: 1fr 1fr; }
.df-row > div { padding: 4px 10px; border-bottom: 1px solid var(--line); min-width: 0; overflow-wrap: anywhere; }
.df-row > div:first-child { border-right: 1px solid var(--line); }
.df-head > div { background: var(--mist); font-weight: 700; color: var(--purple); position: sticky; top: 0; }
.df-del > div:first-child, .df-mod > div:first-child { background: var(--danger-bg); }
.df-add > div:last-child, .df-mod > div:last-child { background: #E9F8F6; }
.df del { background: #F6C6CE; text-decoration: line-through; }
.df ins { background: #B6EBE4; text-decoration: none; }
.df .pg { font-size: 11px; color: var(--muted); margin-right: 6px; font-family: var(--font-latin); }
.df-gap { text-align: center; color: var(--muted); font-size: 12px; background: #FAF8FD; border-bottom: 1px solid var(--line); }
.cmp-vis { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.cmp-vis figure { margin: 0; border: 1.5px solid var(--line); border-radius: 12px; padding: 8px; background: var(--white); }
.cmp-vis figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; text-align: center; }
@media (max-width: 640px) { .df-row { grid-template-columns: 1fr; } .df-row > div:first-child { border-right: 0; } }

.notice { border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.6; background: var(--mist); color: var(--ink); }
.notice.error { background: var(--danger-bg); color: var(--danger); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--white); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

async function saveFile(filename, blob) {

    catch (e) {
      if (e && e.code === 'declined') toast('已取消儲存');
      else if (e && e.code === 'rate_limited') toast('上一個儲存視窗還開著，請先完成它');
      else toast('這個檢視畫面無法儲存檔案，請在瀏覽器中開啟本頁');
    }
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

const scriptCache = {};
function loadScript(key, test) {
  if (test && test()) return Promise.resolve();
  if (!scriptCache[key]) {
    scriptCache[key] = new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = LIBS[key]; el.async = true; el.crossOrigin = 'anonymous';
      el.onload = () => resolve();
      el.onerror = () => { delete scriptCache[key]; el.remove(); reject(new Error('需要的元件下載失敗，請確認網路連線後再試一次。')); };
      document.head.appendChild(el);
    });
  }
  return scriptCache[key];
}

// qpdf (WebAssembly): encryption, decryption and structural repair. A fresh instance per run keeps its FS clean.
let qpdfFactory = null;
async function runQpdf(input, args) {
  if (!qpdfFactory) {
    await loadScript('qpdf');
    qpdfFactory = window.Module; try { delete window.Module; } catch (_) { window.Module = undefined; }
    if (typeof qpdfFactory !== 'function') throw new Error('PDF 引擎載入失敗，請重新整理頁面再試一次。');
  }
  const log = [];
  // this qpdf build binds console.log/error when the module is created, so capture them around the run
  const orig = { log: console.log, error: console.error };
  console.log = (...a) => log.push(a.join(' ')); console.error = (...a) => log.push(a.join(' '));
  let code, q;
  try {
    q = await qpdfFactory({ locateFile: () => LIBS.qpdfWasm, noInitialRun: true });
    q.FS.writeFile('/in.pdf', input);
    try { code = q.callMain([...args.map(a => a === '@in' ? '/in.pdf' : a === '@out' ? '/out.pdf' : a)]); }
    catch (e) { code = e && typeof e.status === 'number' ? e.status : 2; }
  } finally { console.log = orig.log; console.error = orig.error; }
  let out = null;
  try { out = q.FS.readFile('/out.pdf'); } catch (_) {}
  // qpdf exit codes: 0 ok, 3 ok with warnings, 2 error
  return { code, out: (code === 0 || code === 3) ? out : null, log: log.join('\n') };
}

function canvasBlob(c, type = 'image/png', q) { return new Promise(r => c.toBlob(r, type, q)); }
async function canvasBytes(c, type = 'image/png', q) { return new Uint8Array(await (await canvasBlob(c, type, q)).arrayBuffer()); }
async function renderPageCanvas(js, pageNo, dpi, bg = '#fff', rotation) {
  const page = await js.getPage(pageNo);
  const vp = page.getViewport({ scale: dpi / 72, ...(rotation != null ? { rotation } : {}) });
  const c = document.createElement('canvas');
  c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  const ctx = c.getContext('2d');
  if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height); }
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  const vp1 = page.getViewport({ scale: 1, ...(rotation != null ? { rotation } : {}) });
  page.cleanup();
  return { canvas: c, vp1, vp };
}

// Draw an embedded image/page so it appears upright inside a rectangle given in pdf.js viewport
// coordinates (scale 1, top-left origin, page rotation applied). Works for /Rotate 0/90/180/270.
function placeOnPage(pg, obj, rect, vp1, kind = 'image', opacity) {
  const [ax, ay] = vp1.convertToPdfPoint(rect.x, rect.y + rect.h);
  const opts = { x: ax, y: ay, width: rect.w, height: rect.h, rotate: degrees(((vp1.rotation % 360) + 360) % 360) };
  if (opacity != null) opts.opacity = opacity;
  if (kind === 'page') pg.drawPage(obj, { x: opts.x, y: opts.y, width: opts.width, height: opts.height, rotate: opts.rotate });
  else pg.drawImage(obj, opts);
}

// Text layout from pdf.js: items → lines (with font size and position, viewport units).
async function pageLines(js, pageNo) {
  const page = await js.getPage(pageNo);
  const tc = await page.getTextContent();
  // Normally read text as displayed; if most of it runs vertically (e.g. a page whose /Rotate turns
  // upright text sideways), read it in the orientation where it is horizontal instead.
  let vp, items;
  for (const rot of [page.rotate, 0, 90, 180, 270]) {
    vp = page.getViewport({ scale: 1, rotation: rot });
    items = collectItems(tc, vp);
    const vert = items.filter(i => i.vertical).length;
    if (vert <= items.length / 2) break;
  }
  page.cleanup();
  return groupLines(items, vp);
}
function collectItems(tc, vp) {
  const items = [];
  for (const it of tc.items) {
    if (!('str' in it) || !it.str) continue;
    const m = pdfjsLib.Util.transform(vp.transform, it.transform);
    const size = Math.hypot(m[2], m[3]) || Math.abs(it.height) || 10;
    const vertical = Math.abs(m[1]) > Math.abs(m[0]) + .01;
    const w = (it.width || 0) * vp.scale;
    const fam = tc.styles && tc.styles[it.fontName] ? tc.styles[it.fontName].fontFamily : '';
    const upsideDown = m[0] < 0 && Math.abs(m[1]) < .01;
    items.push({ str: it.str, x: m[4], y: m[5] - size, w: vertical ? size : w, h: vertical ? (it.width || size) : size, size, vertical: vertical || upsideDown, font: it.fontName || '', fam });
  }
  return items;
}
function groupLines(items, vp) {
  // group horizontal items into lines by baseline
  // whitespace runs only carry spacing, which the gap logic below already handles
  const hz = items.filter(i => !i.vertical && i.str.trim() !== '').sort((a, b) => a.y - b.y || a.x - b.x);
  const lines = [];
  for (const it of hz) {
    const ln = lines.find(l => Math.abs(l.y + l.h / 2 - (it.y + it.h / 2)) < Math.max(2, Math.min(l.h, it.h) * .45));
    if (ln) ln.items.push(it); else lines.push({ y: it.y, h: it.h, items: [it] });
    if (ln) { const top = Math.min(ln.y, it.y), bot = Math.max(ln.y + ln.h, it.y + it.h); ln.y = top; ln.h = bot - top; }
  }
  for (const l of lines) {
    l.items.sort((a, b) => a.x - b.x);
    let text = '', last = null;
    for (const it of l.items) {
      if (last) {
        const gap = it.x - (last.x + last.w);
        const cjk = /[　-鿿＀-￯]$/.test(text) || /^[　-鿿＀-￯]/.test(it.str);
        if (gap > it.size * .25 && !cjk && !/\s$/.test(text) && !/^\s/.test(it.str)) text += ' ';
        else if (gap > it.size * 1.5 && !/\s$/.test(text)) text += ' ';
      }
      text += it.str; last = it;
    }
    l.text = text.replace(/\s+/g, ' ').trim();
    l.x = l.items[0].x;
    l.w = Math.max(...l.items.map(i => i.x + i.w)) - l.x;
    l.size = l.items.reduce((m, i) => Math.max(m, i.size), 0);
    l.bold = l.items.some(i => /bold|black|heavy|semibold|w[6-9]/i.test(i.fam + ' ' + i.font));
  }
  return { lines: lines.filter(l => l.text), items, width: vp.width, height: vp.height, vp };
}

// Lines → paragraphs/blocks (used by Word, Markdown and layout-keeping translation).
function linesToBlocks(lines, bodySize) {
  const blocks = [];
  let cur = null;
  for (const l of lines) {
    const gap = cur ? l.y - (cur.y + cur.h) : 0;
    const sameStyle = cur && Math.abs(l.size - cur.size) < Math.max(1, cur.size * .12);
    const bullet = /^([•●○▪■◆\-–*]|\d+[.)、]|[a-zA-Z][.)]|[（(]?[一二三四五六七八九十]+[)）、])\s*/.test(l.text);
    if (cur && sameStyle && gap < l.h * .9 && gap > -l.h * .5 && !bullet && Math.abs(l.x - cur.x) < l.size * 4) {
      const cjk = /[　-鿿＀-￯]$/.test(cur.text);
      cur.text = cur.text.replace(/-$/, '') + (cjk || /-$/.test(cur.text) ? '' : ' ') + l.text;
      cur.h = l.y + l.h - cur.y; cur.w = Math.max(cur.x + cur.w, l.x + l.w) - Math.min(cur.x, l.x); cur.x = Math.min(cur.x, l.x);
      cur.lines.push(l);
    } else {
      cur = { text: l.text, x: l.x, y: l.y, w: l.w, h: l.h, size: l.size, bold: l.bold, bullet, lines: [l] };
      blocks.push(cur);
    }
  }
  for (const b of blocks) {
    const r = b.size / (bodySize || b.size);
    b.level = r >= 1.8 ? 1 : r >= 1.4 ? 2 : (r >= 1.15 || (b.bold && b.text.length < 60 && b.lines.length === 1)) ? 3 : 0;
    if (b.text.length > 160) b.level = 0;
  }
  return blocks;
}
function medianSize(allLines) {
  const arr = [];
  allLines.forEach(l => { for (let k = 0; k < Math.min(l.text.length, 200); k++) arr.push(l.size); });
  arr.sort((a, b) => a - b);
  return arr.length ? arr[Math.floor(arr.length / 2)] : 11;
}

async function extractAllText(js, onPage) {
  const pages = [];
  for (let i = 1; i <= js.numPages; i++) {
    onPage && onPage(i);
    const { lines } = await pageLines(js, i);
    pages.push(lines.map(l => l.text).join('\n'));
  }
  return pages;
}

// Multi-line text → transparent PNG (CJK-safe), wrapping to a box width in points.
async function textBoxImage(text, { size = 14, color = '#2E2640', width = null, weight = 400, align = 'left', family = '"Noto Sans TC", "Nunito", "PingFang TC", "Microsoft JhengHei", sans-serif', lineHeight = 1.3, k = 4 }) {
  const font = `${weight} ${size * k}px ${family}`;
  try { await document.fonts.load(font, text); } catch (_) {}
  const m = document.createElement('canvas').getContext('2d'); m.font = font;
  const out = [];
  for (const para of String(text).split('\n')) {
    if (!width) { out.push(para); continue; }
    let line = '';
    for (const ch of para.match(/[　-鿿＀-￯]|[^\s　-鿿＀-￯]+|\s+/g) || ['']) {
      const test = line + ch;
      if (m.measureText(test).width > width * k && line.trim()) { out.push(line.trimEnd()); line = ch.trimStart(); }
      else line = test;
    }
    out.push(line);
  }
  const W = Math.ceil(width ? width * k : Math.max(1, ...out.map(l => m.measureText(l).width)) + 2 * k);
  const lh = size * k * lineHeight;
  const H = Math.ceil(lh * out.length + size * k * .2);
  const c = document.createElement('canvas'); c.width = Math.max(1, W); c.height = Math.max(1, H);
  const ctx = c.getContext('2d'); ctx.font = font; ctx.fillStyle = color; ctx.textBaseline = 'alphabetic';
  ctx.textAlign = align; const ax = align === 'center' ? W / 2 : align === 'right' ? W : 0;
  out.forEach((l, i) => ctx.fillText(l, ax, lh * i + size * k * 1.0));
  return { bytes: await canvasBytes(c), w: W / k, h: H / k, lines: out.length };
}

const isPdfFile = f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);

async function renderThumb(pdf, pageNo, maxW = 160) {
  const page = await pdf.getPage(pageNo);
  const vp1 = page.getViewport({ scale: 1 });
  const scale = Math.min(maxW / vp1.width, (maxW * 1.4) / vp1.height) * (window.devicePixelRatio > 1 ? 2 : 1);
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas');
  c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  c.style.width = (c.width / (window.devicePixelRatio > 1 ? 2 : 1)) + 'px';
  page.cleanup();
  return c;
}

function parseRanges(str, total) {
  const groups = [];
  for (const raw of str.split(/[,，、\s]+/).filter(Boolean)) {
    const m = raw.match(/^(\d+)?\s*[-~–]\s*(\d+)?$/) || raw.match(/^(\d+)$/);
    if (!m) throw new Error(`看不懂「${raw}」，請用像 1-3, 5, 8- 這樣的格式。`);
    let a, b;
    if (m.length === 2) { a = b = +m[1]; } else { a = m[1] ? +m[1] : 1; b = m[2] ? +m[2] : total; }
    if (a < 1 || b > total || a > b) throw new Error(`「${raw}」超出範圍，這份檔案共 ${total} 頁。`);
    groups.push({ label: a === b ? `${a}` : `${a}-${b}`, idx: Array.from({ length: b - a + 1 }, (_, i) => a - 1 + i) });
  }
  if (!groups.length) throw new Error('請輸入至少一個頁碼範圍。');
  return groups;
}

// Text → transparent PNG via canvas, so Chinese renders without embedding a CJK font in the PDF.
async function textImage(text, { size, color, opacity = 1, angle = 0, weight = 700 }) {
  const k = 4;
  const font = `${weight} ${size * k}px "Noto Sans TC", "Nunito", "PingFang TC", "Microsoft JhengHei", sans-serif`;
  try { await document.fonts.load(font, text); } catch (_) {}
  const m = document.createElement('canvas').getContext('2d');
  m.font = font;
  const w = Math.ceil(m.measureText(text).width) + 8 * k, h = Math.ceil(size * k * 1.4);
  const rad = angle * Math.PI / 180;
  const W = Math.ceil(Math.abs(w * Math.cos(rad)) + Math.abs(h * Math.sin(rad)));
  const H = Math.ceil(Math.abs(w * Math.sin(rad)) + Math.abs(h * Math.cos(rad)));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.translate(W / 2, H / 2); ctx.rotate(-rad);
  ctx.font = font; ctx.fillStyle = color; ctx.globalAlpha = opacity;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, 0);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  return { bytes: new Uint8Array(await blob.arrayBuffer()), w: W / k, h: H / k };
}

function acceptAttr(t) { return t.input === 'image' ? 'image/jpeg,image/png,image/webp,image/gif,image/bmp' : t.input === 'file' ? t.accept : 'application/pdf,.pdf'; }
function pickFiles(multi, cb, capture) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = acceptAttr(state.tool); inp.multiple = !!multi;
  if (capture) inp.setAttribute('capture', 'environment');
  inp.hidden = true;
  inp.addEventListener('change', () => { cb([...inp.files]); inp.remove(); });
  document.body.appendChild(inp);
  inp.click();
}
function filterFiles(list) {
  const t = state.tool;
  const ok = list.filter(f => t.input === 'image' ? /^image\//.test(f.type) : t.input === 'file' ? t.match.test(f.name) : isPdfFile(f));
  if (ok.length < list.length) toast(t.input === 'image' ? '只接受 JPG、PNG、WebP、GIF 圖片，其他檔案已略過' : t.input === 'file' ? `只接受${t.kind}，其他檔案已略過` : '只接受 PDF 檔，其他檔案已略過');
  if (!t.multi) return ok.slice(0, 1);
  if (t.max) return ok.slice(0, Math.max(0, t.max - state.files.length));
  return ok;
}

function renderDrop() {
  const t = state.tool;
  const stage = $('#stage');
  const what = t.input === 'image' ? '圖片' : t.input === 'file' ? t.kind.replace(/（.*$/, '') : 'PDF';
  const hint = t.max ? `請放進 ${t.max} 份要比較的 PDF（舊版與新版）。` : t.multi ? `可一次選多個檔案，之後還能再加入或調整順序。` : `一次處理一份${what}。`;
  const privacy = t.ai ? '文字會送到 AI 服務處理，檔案本身不會保存。' : '檔案不會上傳，關掉分頁就清除。';
  stage.innerHTML = `
    <div class="drop" id="drop">
      <svg class="big" viewBox="0 0 80 80" aria-hidden="true">
        <path d="M44.6 7.3 A33 33 0 1 0 72.8 34.5" fill="none" stroke="#603E8D" stroke-width="4" stroke-linecap="round"/>
        <path d="M40 52V27M30 36l10-10 10 10" fill="none" stroke="#603E8D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

        ${t.camera ? `<button class="btn btn-secondary" id="cam" type="button">${ICONS.camera.replace('<svg', '<svg width="20" height="20"')}用鏡頭拍攝</button>` : ''}
        ${t.paste ? `<button class="btn btn-secondary" id="paste" type="button">貼上 HTML 原始碼</button>` : ''}
      </div>
      <p class="hint">${hint}${privacy}</p>
    </div>`;
  const drop = $('#drop');

  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));

async function onFiles(list) {
  const files = filterFiles(list);
  if (!files.length) return;
  const t = state.tool;
  if (t.multi) {
    for (const f of files) state.files.push({ id: Math.random().toString(36).slice(2), file: f, thumb: null, pages: null, err: null });
    renderWork();
    loadFileThumbs();
  } else if (t.input === 'file') {
    state.file = files[0]; state.bytes = await readBytes(files[0]);
    renderWork();
  } else if (t.raw) {
    // unlock / repair: the file may be encrypted or damaged, so don't insist on parsing it
    state.file = files[0]; state.bytes = await readBytes(files[0]);
    state.pages = [];
    try { state.js = await openJs(state.bytes); state.pages = Array.from({ length: state.js.numPages }, (_, i) => ({ i, rot: 0, sel: false, canvas: null })); }
    catch (e) { state.js = null; state.openErr = e; }
    renderWork();
    if (state.js) loadPageThumbs();
  } else {
    overlay.show('讀取檔案');
    try {
      const bytes = await readBytes(files[0]);
      await loadPdf(bytes); // validates + detects encryption
      state.file = files[0]; state.bytes = bytes;
      state.js = await openJs(bytes);
      state.pages = Array.from({ length: state.js.numPages }, (_, i) => ({ i, rot: 0, sel: false, canvas: null }));
      overlay.hide();
      renderWork();
      if (t.view !== 'editor') loadPageThumbs();
    } catch (e) { overlay.hide(); toast(e.message || '讀取失敗'); }
  }
}

    $('#v-wm-op').textContent = f.opacity.value + '%';
  }
  if (OPTS_CHANGE[t.id]) OPTS_CHANGE[t.id](f);
  updateInfo();
}

function updateInfo() {
  const t = state.tool, el = $('#info');
  if (!el) return;
  if (t.multi) {
    const n = state.files.length;
    el.textContent = t.id === 'compare' ? (n === 2 ? '左邊是舊版、右邊是新版，可拖曳交換' : `已放入 ${n} / 2 份 PDF`) : n ? `${n} 個檔案${t.id === 'merge' ? '，拖曳卡片可調整合併順序' : '，拖曳卡片可調整頁序'}` : '';
  } else if (t.view === 'editor' || t.view === 'forms') {
    /* editor/forms keep their own status line */
  } else if (!state.js) {
    el.textContent = state.file ? `${state.file.name} ・ ${fmtSize(state.file.size)}` : '';
  } else {
    const n = state.pages.length;
    if (t.id === 'remove') el.textContent = `共 ${n} 頁，已選 ${state.pages.filter(p => p.sel).length} 頁要刪除`;
    else if (t.id === 'extract') el.textContent = `共 ${n} 頁，已選 ${state.pages.filter(p => p.sel).length} 頁要保留`;
    else if (t.id === 'organize') el.textContent = `共 ${n} 頁，拖曳可調整順序`;
    else if (t.id === 'rotate') el.textContent = `共 ${n} 頁，點一下頁面即可旋轉`;
    else el.textContent = `${state.file.name} ・ ${state.js.numPages} 頁 ・ ${fmtSize(state.file.size)}`;
  }
  const go = $('#go');
  if (go) {
    let disabled = false;
    if (t.multi) disabled = (t.id === 'merge' || t.id === 'compare') ? state.files.length < 2 : state.files.length < 1;
    if (t.multi && state.files.some(f => f.err)) disabled = true;
    if (t.id === 'remove') disabled = !state.pages.some(p => p.sel) || state.pages.every(p => p.sel);
    if (t.id === 'extract') disabled = !state.pages.some(p => p.sel);
    if (t.id === 'organize') disabled = state.pages.length === 0;
    go.disabled = disabled;
    const msg = $('#msg');
    if (msg) {
      let m = '';
      if (t.id === 'merge' && state.files.length === 1) m = '再加入至少一份 PDF 才能合併。';
      if (t.id === 'compare' && state.files.length === 1) m = '再加入第二份 PDF（新版）才能比較。';
      if (t.multi && state.files.some(f => f.err)) m = '有檔案無法讀取，請先移除標成紅字的檔案。';
      if (t.id === 'remove' && state.pages.length && state.pages.every(p => p.sel)) m = '不能刪除全部頁面，至少保留一頁。';
      msg.innerHTML = m ? `<p class="notice">${m}</p>` : '';
    }
  }
}

      <div class="field"><label for="sm-focus">想特別關注的重點（選填）</label><input id="sm-focus" name="focus" type="text" maxlength="200" placeholder="例如 預算、時程、風險" autocomplete="off"></div>

      <div class="field"><span class="label">輸出</span>
        <div class="choices" role="radiogroup" aria-label="輸出">
          <label class="choice"><input type="radio" name="out" value="pdf" checked><div><b>保留版面的 PDF</b><span>把譯文放回原本段落的位置。</span></div></label>
          <label class="choice"><input type="radio" name="out" value="txt"><div><b>純文字</b><span>依段落列出譯文，方便複製。</span></div></label>

}
const AI_NOTE = `<p class="field help" style="margin:0">會把 PDF 的文字送到 AI 服務處理（檔案本身與結果不會被保存）。若網站尚未設定 AI 服務，會改用 Chrome 內建的 AI（如果你的瀏覽器支援）。機密文件請斟酌使用。</p>`;

/* ---------- canvas: file list or page grid ---------- */
function renderCanvas() {
  const t = state.tool, c = $('#canvas');
  if (t.multi) {
    c.innerHTML = `<div class="canvas-bar"><span class="info" id="info"></span>${t.camera ? `<button type="button" class="btn btn-secondary btn-sm" id="camMore">${ICONS.camera.replace('<svg', '<svg width="16" height="16"')}拍攝</button>` : ''}<button type="button" class="btn btn-secondary btn-sm" id="addMore">${ICONS.plus.replace('<svg', '<svg width="16" height="16"')}加入檔案</button></div>
      <ul class="files" id="files"></ul>`;
    $('#addMore').addEventListener('click', () => pickFiles(true, onFiles));
    if (t.camera) $('#camMore').addEventListener('click', () => openCamera());
    renderFiles();
  } else if (t.view === 'pages') {
    c.innerHTML = `<div class="canvas-bar"><span class="info" id="info"></span></div><div class="pages" id="pages"></div>`;
    renderPages();
    bindPageOpts();
  } else if (t.view === 'editor') {
    renderEditor(c);
  } else if (t.view === 'forms') {
    renderForms(c);
  } else if (t.input === 'file' || !state.js) {
    c.innerHTML = `<div class="canvas-bar"><span class="info" id="info"></span></div><div id="fileinfo"></div>`;
    renderFileInfo();
  } else {
    c.innerHTML = `<div class="canvas-bar"><span class="info" id="info"></span></div><div class="pages" id="pages"></div>`;
    renderPages(true);
  }
  updateInfo();
  // drop more files directly onto the workspace
  c.addEventListener('dragover', e => { if (t.multi) e.preventDefault(); });
  c.addEventListener('drop', e => { if (t.multi && e.dataTransfer.files.length) { e.preventDefault(); onFiles([...e.dataTransfer.files]); } });
}

function renderFileInfo() {
  const t = state.tool, box = $('#fileinfo');
  if (t.id === 'html2pdf' && !state.file) {
    box.innerHTML = `<div class="field"><label for="htmlsrc">HTML 原始碼</label><textarea id="htmlsrc" class="textprev" spellcheck="false" placeholder="<h1>標題</h1>\n<p>內容⋯⋯</p>" style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px"></textarea>
      <span class="help">外部圖片若所在網站不允許跨網域讀取，會顯示成空白。網址轉 PDF 因瀏覽器安全限制無法直接抓取，請先在瀏覽器「另存網頁」成 .html 再上傳。</span></div>`;
    $('#htmlsrc').value = state.html || '';
    $('#htmlsrc').addEventListener('input', e => { state.html = e.target.value; });
    return;
  }
  const note = t.raw && !state.js ? `<p class="notice" style="margin-top:12px">${t.id === 'unlock' ? '這份 PDF 需要密碼才能開啟，請在右側輸入密碼。' : '預覽無法開啟這份檔案，看起來確實有損壞，按下修復試試看。'}</p>` : '';
  box.innerHTML = `<div class="fcard" style="max-width:260px;cursor:default"><div class="thumb">${ICONS[t.id]}</div><div class="name" title="${esc(state.file.name)}">${esc(state.file.name)}</div><div class="meta num">${fmtSize(state.file.size)}</div></div>${note}`;
}

function renderFiles() {
  const ul = $('#files'), t = state.tool;
  ul.innerHTML = state.files.map((f, i) => `
    <li class="fcard" draggable="true" data-i="${i}">
      <span class="order">${i + 1}</span>
      <div class="thumb" data-thumb="${f.id}"></div>
      <div class="name" title="${esc(f.file.name)}">${esc(f.file.name)}</div>
      <div class="meta num">${f.err ? `<span style="color:var(--danger)">${esc(f.err)}</span>` : (f.pages ? f.pages + ' 頁 ・ ' : '') + fmtSize(f.file.size)}</div>
      <div class="acts">
        <button type="button" class="icon-btn" data-mv="-1" aria-label="往前移" ${i === 0 ? 'disabled' : ''}>${ICONS.up}</button>
        <button type="button" class="icon-btn" data-mv="1" aria-label="往後移" ${i === state.files.length - 1 ? 'disabled' : ''}>${ICONS.down}</button>
        <button type="button" class="icon-btn" data-del aria-label="移除">${ICONS.x}</button>
      </div>
    </li>`).join('') + `<li><button type="button" class="add-tile" id="addTile" style="width:100%">${ICONS.plus}加入${t.input === 'image' ? '圖片' : 'PDF'}</button></li>`;
  state.files.forEach(f => { if (f.thumb) ul.querySelector(`[data-thumb="${f.id}"]`).appendChild(f.thumb); });
  $('#addTile').addEventListener('click', () => pickFiles(true, onFiles));
  $$('.fcard', ul).forEach(li => {
    const i = +li.dataset.i;
    li.querySelector('[data-mv="-1"]').addEventListener('click', () => moveFile(i, i - 1));
    li.querySelector('[data-mv="1"]').addEventListener('click', () => moveFile(i, i + 1));
    li.querySelector('[data-del]').addEventListener('click', () => { state.files.splice(i, 1); renderFiles(); updateInfo(); });
  });
  enableDragSort(ul, '.fcard', (from, to) => moveFile(from, to));
  updateInfo();
}
function moveFile(from, to) {
  if (to < 0 || to >= state.files.length || from === to) return;
  const [f] = state.files.splice(from, 1); state.files.splice(to, 0, f); renderFiles();
}

async function loadFileThumbs() {
  for (const f of state.files) {
    if (f.thumb || f.err || f.loading) continue;
    f.loading = true;
    try {
      if (state.tool.input === 'image') {
        const img = new Image(); img.src = URL.createObjectURL(f.file); img.alt = '';
        await img.decode(); f.thumb = img;
      } else {
        const bytes = await readBytes(f.file);
        await loadPdf(bytes);
        const js = await openJs(bytes);
        f.pages = js.numPages;
        f.thumb = await renderThumb(js, 1, 140);
        js.destroy();
      }
    } catch (e) { f.err = e.message || '無法讀取'; }
    const holder = document.querySelector(`[data-thumb="${f.id}"]`);
    if (holder) renderFiles();
  }
}

function enableDragSort(container, sel, onMove) {
  let from = null;
  $$(sel, container).forEach(el => {
    el.addEventListener('dragstart', e => { from = +el.dataset.i; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(from)); } catch (_) {} });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); $$('.drop-before', container).forEach(x => x.classList.remove('drop-before')); });
    el.addEventListener('dragover', e => { if (from === null) return; e.preventDefault(); e.stopPropagation(); $$('.drop-before', container).forEach(x => x.classList.remove('drop-before')); el.classList.add('drop-before'); });
    el.addEventListener('drop', e => {
      if (from === null) return;
      e.preventDefault(); e.stopPropagation();
      let to = +el.dataset.i; if (from < to) to -= 1;
      const f = from; from = null; onMove(f, to);
    });
  });
}

/* page grid */
function renderPages(previewOnly = false) {
  const t = state.tool, box = $('#pages');
  const showCount = previewOnly ? Math.min(state.pages.length, 24) : state.pages.length;
  box.innerHTML = state.pages.slice(0, showCount).map((p, k) => {
    const cls = t.id === 'remove' && p.sel ? 'sel-remove' : t.id === 'extract' && p.sel ? 'sel-keep' : '';
    const acts = t.id === 'organize' ? `<div class="acts">
        <button type="button" class="icon-btn" data-a="left" aria-label="往前移">${ICONS.up}</button>
        <button type="button" class="icon-btn" data-a="rot" aria-label="旋轉">${ICONS.rotR}</button>
        <button type="button" class="icon-btn" data-a="del" aria-label="刪除此頁">${ICONS.x}</button>
        <button type="button" class="icon-btn" data-a="right" aria-label="往後移">${ICONS.down}</button></div>` : '';
    return `<div class="pcard ${cls}" data-i="${k}" ${t.id === 'organize' ? 'draggable="true"' : ''} ${previewOnly ? '' : 'tabindex="0" role="button"'} aria-label="第 ${p.i + 1} 頁">
      <span class="badge">${t.id === 'remove' ? ICONS.cross : ICONS.check}</span>
      <div class="thumb" data-pg="${p.i}"></div>
      <span class="pn">${p.i + 1}</span>${acts}</div>`;
  }).join('') + (showCount < state.pages.length ? `<div class="pcard" style="cursor:default;justify-content:center"><span class="pn">還有 ${state.pages.length - showCount} 頁</span></div>` : '');
  $$('.pcard[data-i]', box).forEach(el => {
    const k = +el.dataset.i, p = state.pages[k];
    const holder = el.querySelector('.thumb');
    if (p.canvas) { holder.appendChild(p.canvas); p.canvas.style.transform = `rotate(${p.rot}deg)`; }
    else holder.innerHTML = '<div class="placeholder-page"></div>';
    if (previewOnly) return;
    const act = () => {
      if (t.id === 'remove' || t.id === 'extract') { p.sel = !p.sel; el.className = 'pcard ' + (p.sel ? (t.id === 'remove' ? 'sel-remove' : 'sel-keep') : ''); updateInfo(); }
      else if (t.id === 'rotate') { p.rot = (p.rot + 90) % 360; if (p.canvas) p.canvas.style.transform = `rotate(${p.rot}deg)`; }
    };
    el.addEventListener('click', e => { if (e.target.closest('.acts')) return; act(); });
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
    if (t.id === 'organize') {
      el.querySelector('[data-a="left"]').addEventListener('click', () => movePage(k, k - 1));
      el.querySelector('[data-a="right"]').addEventListener('click', () => movePage(k, k + 1));
      el.querySelector('[data-a="rot"]').addEventListener('click', () => { p.rot = (p.rot + 90) % 360; if (p.canvas) p.canvas.style.transform = `rotate(${p.rot}deg)`; });
      el.querySelector('[data-a="del"]').addEventListener('click', () => {
        if (state.pages.length === 1) { toast('至少要保留一頁'); return; }
        state.pages.splice(k, 1); renderPages(); updateInfo();
      });
    }
  });
  if (t.id === 'organize') enableDragSort(box, '.pcard', movePage);
}
function movePage(from, to) {
  if (to < 0 || to >= state.pages.length || from === to) return;
  const [p] = state.pages.splice(from, 1); state.pages.splice(to, 0, p); renderPages();
}
function bindPageOpts() {
  const t = state.tool;
  if (t.id === 'remove') $('#clearSel').addEventListener('click', () => { state.pages.forEach(p => p.sel = false); renderPages(); updateInfo(); });
  if (t.id === 'extract') $('#applyRanges').addEventListener('click', () => {
    try {
      const groups = parseRanges($('#pick-ranges').value, state.pages.length);
      const set = new Set(groups.flatMap(g => g.idx));
      state.pages.forEach(p => p.sel = set.has(p.i)); renderPages(); updateInfo();
    } catch (e) { toast(e.message); }
  });
  if (t.id === 'organize') $('#resetOrder').addEventListener('click', () => {
    state.pages = Array.from({ length: state.js.numPages }, (_, i) => {
      const old = state.allPages ? state.allPages[i] : null;
      return { i, rot: 0, sel: false, canvas: old ? old.canvas : null };
    });
    renderPages(); updateInfo();
  });
  if (t.id === 'rotate') $$('[data-rotall]').forEach(b => b.addEventListener('click', () => {
    const d = +b.dataset.rotall;
    state.pages.forEach(p => { p.rot = (p.rot + d + 360) % 360; if (p.canvas) p.canvas.style.transform = `rotate(${p.rot}deg)`; });
  }));
}
async function loadPageThumbs() {
  state.allPages = state.pages.slice();
  const js = state.js;
  const limit = ['remove', 'extract', 'organize', 'rotate'].includes(state.tool.id) ? state.pages.length : Math.min(state.pages.length, 24);
  for (let k = 0; k < limit; k++) {
    const p = state.allPages[k];
    if (state.js !== js) return; // user switched files
    try { p.canvas = await renderThumb(js, p.i + 1, 120); } catch (_) { continue; }
    const holder = document.querySelector(`.thumb[data-pg="${p.i}"]`);
    if (holder) { holder.innerHTML = ''; holder.appendChild(p.canvas); p.canvas.style.transform = `rotate(${p.rot}deg)`; }
    if (k % 4 === 3) await tick();
  }
}

/* ================= processing ================= */
async function run() {
  const t = state.tool;
  const f = $('#opts');
  const opts = f ? Object.fromEntries(new FormData(f).entries()) : (state.lastOpts || {});
  state.lastOpts = opts;
  overlay.show(t.name);
  try {
    const out = await PROCESS[t.id](opts);
    overlay.set(1, '完成');
    await tick();
    overlay.hide();
    state.result = out;
    renderResult(out);
  } catch (e) {
    overlay.hide();
    const msg = $('#msg');
    if (msg) msg.innerHTML = `<p class="notice error">${esc(e.message || '處理失敗，請再試一次。')}</p>`;
    else toast(e.message || '處理失敗，請再試一次。', 6000);
    console.error(e);
  }
}

async function copyPagesTo(out, src, specs) {
  // specs: [{i, rot}] — copies pages in this order and applies extra rotation
  const copied = await out.copyPages(src, specs.map(s => s.i));
  copied.forEach((pg, k) => {
    const extra = specs[k].rot || 0;
    if (extra) pg.setRotation(degrees((pg.getRotation().angle + extra) % 360));
    out.addPage(pg);
  });
}

const PROCESS = {
  async merge() {
    const out = await PDFDocument.create();
    const n = state.files.length;
    for (let k = 0; k < n; k++) {
      const f = state.files[k];
      overlay.set(k / n, `合併第 ${k + 1} / ${n} 個檔案：${f.file.name}`);
      const src = await loadPdf(await readBytes(f.file)).catch(e => { throw new Error(`${f.file.name}：${e.message}`); });
      await copyPagesTo(out, src, src.getPageIndices().map(i => ({ i })));
    }
    const bytes = await out.save();
    return { kind: 'file', name: 'merged.pdf', blob: pdfBlob(bytes), title: '合併完成', detail: `${n} 個檔案，共 ${out.getPageCount()} 頁` };
  },

  async split(o) {
    const src = await loadPdf(state.bytes);
    const total = src.getPageCount();
    const groups = o.mode === 'each'
      ? Array.from({ length: total }, (_, i) => ({ label: String(i + 1), idx: [i] }))
      : parseRanges(o.ranges || '', total);
    const base = baseName(state.file.name);
    const parts = [];
    for (let k = 0; k < groups.length; k++) {
      overlay.set(k / groups.length, `產生第 ${k + 1} / ${groups.length} 份`);
      const out = await PDFDocument.create();
      await copyPagesTo(out, src, groups[k].idx.map(i => ({ i })));
      parts.push({ name: `${base}_p${groups[k].label}.pdf`, bytes: await out.save() });
    }
    if (parts.length === 1) return { kind: 'file', name: parts[0].name, blob: pdfBlob(parts[0].bytes), title: '分割完成', detail: `第 ${groups[0].label} 頁` };
    const zip = new JSZip(); parts.forEach(p => zip.file(p.name, p.bytes));
    const blob = await zip.generateAsync({ type: 'blob' }, m => overlay.set(.9 + m.percent / 1000, '打包 ZIP…'));
    return { kind: 'file', name: `${base}_split.zip`, blob, title: '分割完成', detail: `拆成 ${parts.length} 份 PDF，已打包成 ZIP` };
  },

  async remove() {
    const src = await loadPdf(state.bytes);
    const keep = state.pages.filter(p => !p.sel);
    const out = await PDFDocument.create();
    await copyPagesTo(out, src, keep.map(p => ({ i: p.i })));
    return { kind: 'file', name: baseName(state.file.name) + '_edited.pdf', blob: pdfBlob(await out.save()), title: '頁面已刪除', detail: `刪除 ${state.pages.length - keep.length} 頁，剩下 ${keep.length} 頁` };
  },

  async extract() {
    const src = await loadPdf(state.bytes);
    const keep = state.pages.filter(p => p.sel);
    const out = await PDFDocument.create();
    await copyPagesTo(out, src, keep.map(p => ({ i: p.i })));
    return { kind: 'file', name: baseName(state.file.name) + '_extract.pdf', blob: pdfBlob(await out.save()), title: '擷取完成', detail: `擷取 ${keep.length} 頁` };
  },

  async organize() {
    const src = await loadPdf(state.bytes);
    const out = await PDFDocument.create();
    await copyPagesTo(out, src, state.pages.map(p => ({ i: p.i, rot: p.rot })));
    return { kind: 'file', name: baseName(state.file.name) + '_organized.pdf', blob: pdfBlob(await out.save()), title: '頁面已整理', detail: `共 ${state.pages.length} 頁` };
  },

  async rotate() {
    const src = await loadPdf(state.bytes);
    const out = await PDFDocument.create();
    await copyPagesTo(out, src, state.pages.map(p => ({ i: p.i, rot: p.rot })));
    const n = state.pages.filter(p => p.rot).length;
    return { kind: 'file', name: baseName(state.file.name) + '_rotated.pdf', blob: pdfBlob(await out.save()), title: '旋轉完成', detail: n ? `旋轉了 ${n} 頁` : '沒有頁面被旋轉，檔案內容與原本相同' };
  },

  async compress(o) {
    const before = state.file.size;
    let bytes;
    if (o.level === 'lossless') {
      overlay.set(.3, '重新整理檔案結構…');
      const src = await loadPdf(state.bytes);
      bytes = await src.save({ useObjectStreams: true });
    } else {
      const dpi = o.level === 'strong' ? 80 : 120, q = o.level === 'strong' ? .5 : .68;
      const js = state.js, n = js.numPages;
      const out = await PDFDocument.create();
      const c = document.createElement('canvas'), ctx = c.getContext('2d');
      for (let i = 1; i <= n; i++) {
        overlay.set((i - 1) / n, `壓縮第 ${i} / ${n} 頁`);
        const page = await js.getPage(i);

  async img2pdf(o) {

    for (let k = 0; k < n; k++) {
      const f = state.files[k];

      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      const ctx = c.getContext('2d');

      const r = Math.min(aw / c.width, ah / c.height);
      const w = c.width * r, h = c.height * r;
      const pg = out.addPage([pw, ph]);
      pg.drawImage(img, { x: (pw - w) / 2, y: (ph - h) / 2, width: w, height: h });

  async watermark(o) {
    const text = (o.text || '').trim();

    const src = await loadPdf(state.bytes);
    const im = await textImage(text, { size: +o.size, color: o.color, opacity: +o.opacity / 100, angle: +o.angle });
    const img = await src.embedPng(im.bytes);
    const pages = src.getPages();
    pages.forEach((pg, k) => {
      overlay.set(k / pages.length, `處理第 ${k + 1} / ${pages.length} 頁`);
      const { width: W, height: H } = pg.getSize();
      const { x: ox, y: oy } = pg.getMediaBox();
      if (o.layout === 'tile') {
        const sx = im.w + 60, sy = im.h + 60;
        for (let y = oy - im.h / 2; y < oy + H; y += sy)
          for (let x = ox - im.w / 2 + ((Math.round((y - oy) / sy) % 2) ? sx / 2 : 0); x < ox + W; x += sx)
            pg.drawImage(img, { x, y, width: im.w, height: im.h });
      } else {
        const r = Math.min(1, (W * .9) / im.w, (H * .9) / im.h);
        pg.drawImage(img, { x: ox + (W - im.w * r) / 2, y: oy + (H - im.h * r) / 2, width: im.w * r, height: im.h * r });

  async pagenum(o) {
    const src = await loadPdf(state.bytes);

    const total = pages.length - (skip ? 1 : 0) + start - 1;
    const fmt = (i) => ({ n: `${i}`, nN: `${i} / ${total}`, zh: `第 ${i} 頁`, zhN: `第 ${i} 頁，共 ${total} 頁`, dash: `- ${i} -` }[o.fmt]);
    const margin = 28;
    for (let k = 0; k < pages.length; k++) {
      if (skip && k === 0) continue;
      overlay.set(k / pages.length, `處理第 ${k + 1} / ${pages.length} 頁`);
      const num = start + k - (skip ? 1 : 0);
      const im = await textImage(fmt(num), { size, color: '#2E2640', weight: 500 });
      const img = await src.embedPng(im.bytes);
      const pg = pages[k];

      pg.drawImage(img, { x: ox + x, y: oy + y, width: im.w, height: im.h });
    }
    return { kind: 'file', name: baseName(state.file.name) + '_numbered.pdf', blob: pdfBlob(await src.save()), title: '頁碼已加入', detail: `從 ${start} 開始編號${skip ? '，封面不編號' : ''}` };
  },
};

// ---------- scan filters ----------
function scanFilter(c, mode) {
  if (!mode || mode === 'color') return;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  const W = c.width, H = c.height;
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  // illumination: heavily downscaled copy, scaled back up = smooth background estimate
  const sw = Math.max(8, Math.round(W / 24)), sh = Math.max(8, Math.round(H / 24));
  const small = document.createElement('canvas'); small.width = sw; small.height = sh;
  const sctx = small.getContext('2d'); sctx.imageSmoothingQuality = 'high'; sctx.drawImage(c, 0, 0, sw, sh);
  // dilate background (take local max) so text strokes don't darken the estimate
  const sd = sctx.getImageData(0, 0, sw, sh); const sdd = sd.data, cp = new Uint8ClampedArray(sdd);
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    let m = [0, 0, 0];
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = Math.min(sw - 1, Math.max(0, x + dx)), yy = Math.min(sh - 1, Math.max(0, y + dy)), k = (yy * sw + xx) * 4;
      for (let ch = 0; ch < 3; ch++) m[ch] = Math.max(m[ch], cp[k + ch]);
    }
    const k = (y * sw + x) * 4; sdd[k] = m[0]; sdd[k + 1] = m[1]; sdd[k + 2] = m[2];
  }
  sctx.putImageData(sd, 0, 0);
  const bgc = document.createElement('canvas'); bgc.width = W; bgc.height = H;
  const bctx = bgc.getContext('2d'); bctx.imageSmoothingQuality = 'high'; bctx.drawImage(small, 0, 0, W, H);
  const bg = bctx.getImageData(0, 0, W, H).data;
  for (let i = 0; i < d.length; i += 4) {
    let r = Math.min(255, d[i] / Math.max(1, bg[i]) * 255), g = Math.min(255, d[i + 1] / Math.max(1, bg[i + 1]) * 255), b = Math.min(255, d[i + 2] / Math.max(1, bg[i + 2]) * 255);
    if (mode === 'doc') {
      // gentle S-curve: paper → white, ink → darker
      const f = v => { v /= 255; v = v < .9 ? Math.pow(v / .9, 1.6) * .9 : 1; return v * 255; };
      d[i] = f(r); d[i + 1] = f(g); d[i + 2] = f(b);
    } else {
      let y = .299 * r + .587 * g + .114 * b;
      if (mode === 'bw') y = y > 165 ? 255 : 0;
      else y = y < 235 ? Math.pow(y / 235, 1.3) * 235 : 255;
      d[i] = d[i + 1] = d[i + 2] = y;
    }
  }
  ctx.putImageData(img, 0, 0);
}

// ---------- camera ----------
async function openCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { pickFiles(true, onFiles, true); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 2560 }, height: { ideal: 1920 } }, audio: false }); }
  catch (e) { toast('無法使用鏡頭（可能未授權或沒有鏡頭），改用選擇照片。'); pickFiles(true, onFiles, true); return; }
  const shots = [];
  const wrap = document.createElement('div');
  wrap.className = 'overlay'; wrap.setAttribute('role', 'dialog'); wrap.setAttribute('aria-label', '拍攝文件');
  wrap.innerHTML = `<div class="cam-card"><video playsinline autoplay muted></video><div class="cam-bar"><span class="num" id="camCount">已拍 0 張</span><button class="btn btn-primary" id="camShot" type="button">${ICONS.camera.replace('<svg', '<svg width="20" height="20"')}拍照</button><button class="btn btn-secondary" id="camDone" type="button">完成</button></div></div>`;
  document.body.appendChild(wrap);
  const v = $('video', wrap); v.srcObject = stream;
  const close = () => { stream.getTracks().forEach(t => t.stop()); wrap.remove(); document.removeEventListener('keydown', onKey); if (shots.length) onFiles(shots); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  $('#camDone', wrap).addEventListener('click', close);
  $('#camShot', wrap).addEventListener('click', async () => {
    if (!v.videoWidth) return;
    const c = document.createElement('canvas'); c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const blob = await canvasBlob(c, 'image/jpeg', .92);

    $('#camCount', wrap).textContent = `已拍 ${shots.length} 張`;
    v.style.opacity = .3; setTimeout(() => { v.style.opacity = 1; }, 120);

}

function sanitizeHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,iframe,object,embed,frame,frameset,meta[http-equiv],link[rel=import]').forEach(n => n.remove());
  doc.querySelectorAll('*').forEach(el => { for (const a of [...el.attributes]) { if (/^on/i.test(a.name) || (/^(href|src|action|formaction|xlink:href)$/i.test(a.name) && /^\s*javascript:/i.test(a.value))) el.removeAttribute(a.name); } });
  return doc;
}
function pageDims(o) { let [w, h] = PAGE_SIZES[o.size] || PAGE_SIZES.a4; if (o.orient === 'l') [w, h] = [h, w]; return [w, h]; }

async function makeFrame(doc, widthPx) {
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', 'allow-same-origin');
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = `position:fixed;left:-20000px;top:0;width:${widthPx}px;height:800px;border:0;visibility:hidden`;
  document.body.appendChild(f);
  const style = doc.createElement('style'); style.textContent = DOC_CSS; doc.head.prepend(style);
  const fontLink = doc.createElement('link'); fontLink.rel = 'stylesheet'; fontLink.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap'; doc.head.prepend(fontLink);
  await new Promise(res => { f.onload = res; f.srcdoc = '<!doctype html>' + doc.documentElement.outerHTML; setTimeout(res, 8000); });
  const d = f.contentDocument;
  await Promise.race([Promise.all([...d.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; }))), sleep(8000)]);
  try { await Promise.race([d.fonts.ready, sleep(5000)]); } catch (_) {}
  return f;
}

// Render one or more HTML sections into page images; each section starts on a new page.
async function htmlSectionsToPdf(sections, o, out, progress) {
  await loadScript('html2canvas', () => window.html2canvas);
  const [pw, ph] = pageDims(o);
  const margin = 36, px = 96 / 72, scale = 2;
  const contentW = Math.round((pw - margin * 2) * px);
  for (let s = 0; s < sections.length; s++) {
    progress && progress(s / sections.length, sections.length > 1 ? `排版第 ${s + 1} / ${sections.length} 部分` : '排版中…');
    const frame = await makeFrame(sanitizeHtml(sections[s]), contentW);
    try {
      const d = frame.contentDocument;
      const fullW = Math.max(contentW, d.documentElement.scrollWidth, d.body.scrollWidth);
      if (fullW > contentW) { frame.style.width = fullW + 'px'; await sleep(50); }
      const fullH = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight, 1);
      frame.style.height = fullH + 'px';
      const canvas = await window.html2canvas(d.documentElement, { scale, backgroundColor: '#ffffff', useCORS: true, logging: false, windowWidth: fullW, windowHeight: fullH, width: fullW, height: fullH });
      await canvasToPages(canvas, out, { pw, ph, margin, fit: fullW * scale });
    } finally { frame.remove(); }
  }
}

// Slice a tall canvas into pages, preferring to break on blank rows so text lines aren't cut.
async function canvasToPages(canvas, out, { pw, ph, margin, fit }) {
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const k = (pw - margin * 2) / fit; // pt per canvas px
  const sliceH = Math.floor((ph - margin * 2) / k);
  let y = 0;
  const isBlankRow = row => { const d = ctx.getImageData(0, row, canvas.width, 1).data; for (let i = 0; i < d.length; i += 16) if (d[i] < 245 || d[i + 1] < 245 || d[i + 2] < 245) return false; return true; };
  while (y < canvas.height - 2) {
    let end = Math.min(canvas.height, y + sliceH);
    if (end < canvas.height) {
      for (let r = end; r > y + sliceH * .8; r -= 2) if (isBlankRow(r)) { end = r; break; }
    }
    const part = document.createElement('canvas'); part.width = canvas.width; part.height = end - y;
    part.getContext('2d').drawImage(canvas, 0, y, canvas.width, end - y, 0, 0, canvas.width, end - y);
    const img = await out.embedJpg(await canvasBytes(part, 'image/jpeg', .9));
    const pg = out.addPage([pw, ph]);
    pg.drawImage(img, { x: margin, y: ph - margin - part.height * k, width: part.width * k, height: part.height * k });
    y = end;
  }
}

function printHtml(sections, o) {
  const [pw, ph] = pageDims(o);
  const html = sections.map((h, i) => { const d = sanitizeHtml(h); return `<section style="${i ? 'break-before:page;' : ''}">${d.head.innerHTML.replace(/<title>.*?<\/title>/i, '')}${d.body.innerHTML}</section>`; }).join('');
  const f = document.createElement('iframe');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  const d = f.contentDocument;
  d.open(); d.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(state.file ? baseName(state.file.name) : 'document')}</title><style>${DOC_CSS}@page{size:${pw}pt ${ph}pt;margin:36pt}</style></head><body>${html}</body></html>`); d.close();
