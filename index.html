    try { await Promise.race([d.fonts.ready, sleep(3000)]); } catch (_) {}
    f.contentWindow.focus(); f.contentWindow.print();
    setTimeout(() => f.remove(), 60000); res();
  }, 300));
}

// ---------- PPTX → HTML slides ----------
const EMU = 9525; // EMU per CSS px
async function pptxSlides(bytes) {
  const zip = await JSZip.loadAsync(bytes);
  const xml = async p => { const f = zip.file(p); return f ? new DOMParser().parseFromString(await f.async('string'), 'application/xml') : null; };
  const rels = async p => { const dir = p.replace(/[^/]+$/, ''), name = p.replace(/^.*\//, ''); const d = await xml(`${dir}_rels/${name}.rels`); const m = {}; if (d) for (const r of d.getElementsByTagName('Relationship')) { let t = r.getAttribute('Target'); if (r.getAttribute('TargetMode') !== 'External') t = resolvePath(dir, t); m[r.getAttribute('Id')] = { target: t, type: r.getAttribute('Type') }; } return m; };
  const resolvePath = (dir, t) => { if (t.startsWith('/')) return t.slice(1); const parts = (dir + t).split('/'); const out = []; for (const p of parts) { if (p === '..') out.pop(); else if (p !== '.') out.push(p); } return out.join('/'); };
  const pres = await xml('ppt/presentation.xml');
  if (!pres) throw new Error('這不是有效的 .pptx 檔案。');
  const sz = pres.getElementsByTagName('p:sldSz')[0];
  const W = +sz.getAttribute('cx') / EMU, H = +sz.getAttribute('cy') / EMU;
  const prel = await rels('ppt/presentation.xml');
  const ids = [...pres.getElementsByTagName('p:sldId')].map(n => n.getAttribute('r:id'));
  // theme colors
  const themeRel = Object.values(prel).find(r => /theme$/.test(r.type));
  const theme = themeRel ? await xml(themeRel.target) : null;
  const scheme = {};
  if (theme) { const cs = theme.getElementsByTagName('a:clrScheme')[0]; if (cs) for (const c of cs.children) { const v = c.firstElementChild; if (v) scheme[c.localName] = v.localName === 'sysClr' ? (v.getAttribute('lastClr') || (/text/i.test(v.getAttribute('val')) ? '000000' : 'FFFFFF')) : v.getAttribute('val'); } }

// ---------- header/footer removal shared by Word / Markdown ----------
function dropRepeating(pagesLines) {

    const edge = l.y < p.height * .06 || l.y + l.h > p.height * .94;
    if (!edge) return true;
    if (/^[-–—\s]*(\d+|[ivxlc]+)\s*([\/／]\s*\d+)?[-–—\s]*$/i.test(l.text) || /^(第\s*\d+\s*頁|page\s*\d+)/i.test(l.text)) return false;
    return (count[norm(l.text)] || 0) < Math.max(3, n * .6);

// split a line into cells by large gaps (for tables)
function lineCells(l) {
  const cells = []; let cur = null;
  for (const it of l.items) {

    else { cur = { text: it.str, x: it.x, w: it.w }; cells.push(cur); }
  }
  return cells.map(c => ({ ...c, text: c.text.trim() })).filter(c => c.text);
}

// lines → blocks, with runs of ≥2 lines that share the same number (≥2) of gap-separated cells kept as tables
function structureLines(lines, body, tables = true) {
  const out = [];
  const cellsOf = lines.map(l => tables ? lineCells(l) : []);
  let k = 0;
  while (k < lines.length) {
    const c0 = cellsOf[k];
    if (c0.length >= 2) {
      let j = k + 1;
      while (j < lines.length && cellsOf[j].length === c0.length) j++;
      if (j - k >= 2) { out.push({ table: cellsOf.slice(k, j).map(r => r.map(c => c.text)), lines: lines.slice(k, j) }); k = j; continue; }
    }
    let j = k + 1;
    while (j < lines.length && !(cellsOf[j].length >= 2 && j + 1 < lines.length && cellsOf[j + 1].length === cellsOf[j].length)) j++;
    out.push(...linesToBlocks(lines.slice(k, j), body));
    k = j;
  }

}

// A compact sRGB-like ICC v2 display profile (D50 PCS, gamma 2.2), generated in place so no binary asset is needed.
function makeSrgbIcc() {

  const xyz = (x, y, z) => [...[0x58, 0x59, 0x5A, 0x20], 0, 0, 0, 0, ...s15(x), ...s15(y), ...s15(z)];
  const ascii = s => [...s].map(c => c.charCodeAt(0));
  const u32 = n => [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255];
  const desc = s => { const a = [...ascii(s), 0]; return [...ascii('desc'), 0, 0, 0, 0, ...u32(a.length), ...a, ...new Array(11).fill(0), ...new Array(67).fill(0)]; };
  const curv = [...ascii('curv'), 0, 0, 0, 0, ...u32(1), 0x02, 0x33, 0, 0];
  tags.push(['desc', desc('sRGB IEC61966-2.1')]);
  tags.push(['cprt', [...ascii('text'), 0, 0, 0, 0, ...ascii('No copyright, use freely'), 0]]);
  tags.push(['wtpt', xyz(0.9642, 1.0, 0.8249)]);
  tags.push(['rXYZ', xyz(0.4361, 0.2225, 0.0139)]);
  tags.push(['gXYZ', xyz(0.3851, 0.7169, 0.0971)]);
  tags.push(['bXYZ', xyz(0.1431, 0.0606, 0.7141)]);
  tags.push(['rTRC', curv]); tags.push(['gTRC', curv]); tags.push(['bTRC', curv]);
  const pad4 = a => { while (a.length % 4) a.push(0); return a; };
  let offset = 128 + 4 + tags.length * 12;
  const table = [...u32(tags.length)], data = [];
  for (const [sig, body] of tags) { const b = pad4([...body]); table.push(...ascii(sig), ...u32(offset), ...u32(body.length)); data.push(...b); offset += b.length; }
  const size = 128 + table.length + data.length;
  const header = new Array(128).fill(0);
  const put = (off, arr) => arr.forEach((v, i) => { header[off + i] = v; });
  put(0, u32(size)); put(8, [0x02, 0x10, 0, 0]); put(12, ascii('mntr')); put(16, ascii('RGB ')); put(20, ascii('XYZ '));

}

// ---------- text diff ----------
function lcsDiff(a, b, eq = (x, y) => x === y) {
  const n = a.length, m = b.length;
  if (n * m > 25e6) return null;
  const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = eq(a[i], b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (eq(a[i], b[j])) { ops.push({ t: '=', a: a[i], b: b[j] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) ops.push({ t: '-', a: a[i++] });
    else ops.push({ t: '+', b: b[j++] });
  }
  while (i < n) ops.push({ t: '-', a: a[i++] });
  while (j < m) ops.push({ t: '+', b: b[j++] });
  return ops;
}
function inlineDiff(x, y) {
  if (x.length > 400 || y.length > 400) return null;
  const ops = lcsDiff([...x], [...y]);
  let a = '', b = '';
  for (const o of ops) {
    if (o.t === '=') { a += esc(o.a); b += esc(o.b); }
    else if (o.t === '-') a += `<del>${esc(o.a)}</del>`;
    else b += `<ins>${esc(o.b)}</ins>`;
  }
  return { a: a.replace(/<\/del><del>/g, ''), b: b.replace(/<\/ins><ins>/g, '') };
}

  async pdf2excel(o) {

    const merged = [];
    let cells = 0;
    const toVal = t => { if (!o.numbers) return t; const s = t.replace(/[,，\s]/g, ''); if (/^[-+]?\(?\$?NT?\$?\d+(\.\d+)?\)?%?$/.test(s) || /^[-+]?\d+(\.\d+)?%?$/.test(s)) { let v = parseFloat(s.replace(/[^\d.\-]/g, '')); if (/^\(.*\)$/.test(s)) v = -v; if (s.endsWith('%')) v /= 100; return isFinite(v) ? v : t; } return t; };
    for (let i = 1; i <= n; i++) {
      overlay.set((i - 1) / n, `分析第 ${i} / ${n} 頁`);
      const { lines } = await pageLines(js, i);
      const rows = lines.map(l => lineCells(l));
      const xs = rows.flat().map(c => c.x).sort((a, b) => a - b);
      const anchors = [];
      for (const x of xs) { if (!anchors.length || x - anchors[anchors.length - 1].max > 8) anchors.push({ min: x, max: x, xs: [x] }); else { anchors[anchors.length - 1].max = x; anchors[anchors.length - 1].xs.push(x); } }
      const colOf = x => { let best = 0, d = Infinity; anchors.forEach((a, k) => { const dd = x < a.min ? a.min - x : x > a.max ? x - a.max : 0; if (dd < d) { d = dd; best = k; } }); return best; };
      const aoa = rows.map(r => { const row = []; for (const c of r) { const k = colOf(c.x); row[k] = row[k] != null ? row[k] + ' ' + c.text : c.text; } return Array.from({ length: anchors.length }, (_, k) => row[k] != null ? toVal(row[k]) : null); });
      cells += aoa.reduce((s, r) => s + r.filter(v => v != null).length, 0);
      if (o.sheets === 'one') { if (merged.length) merged.push([]); merged.push(...aoa); }
      else { const ws = XLSX.utils.aoa_to_sheet(aoa.length ? aoa : [['（這一頁沒有文字）']]); ws['!cols'] = anchors.map((_, k) => ({ wch: Math.min(50, Math.max(8, ...aoa.map(r => String(r[k] ?? '').length * 1.6))) })); XLSX.utils.book_append_sheet(wb, ws, `第${i}頁`); }

    if (!cells) throw new Error('這份 PDF 裡找不到文字，可能是掃描檔，請先用「OCR 文字辨識」。');
    if (o.sheets === 'one') { const ws = XLSX.utils.aoa_to_sheet(merged); XLSX.utils.book_append_sheet(wb, ws, '表格'); }
    const buf = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
    return { kind: 'file', name: baseName(state.file.name) + '.xlsx', blob: new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), title: '轉換完成', detail: `${n} 頁，${cells.toLocaleString()} 個儲存格` };
  },

  async crop(o) {
    const cb = state.ed && state.ed.crop;

      const [x1, y1] = vp1.convertToPdfPoint(r.x, r.y), [x2, y2] = vp1.convertToPdfPoint(r.x + r.w, r.y + r.h);
      const x = Math.min(x1, x2), y = Math.min(y1, y2), w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);

      pages[i].setArtBox(x, y, w, h);

    if (!r.out) {
      if (/invalid password/i.test(r.log)) throw new Error(pw ? '密碼不正確，請再確認一次。' : '這份 PDF 需要開啟密碼，請在右側輸入。');

  async protect(o) {
    if (!o.pw) throw new Error('請輸入開啟密碼。');
    if (o.pw !== o.pw2) throw new Error('兩次輸入的密碼不一樣。');
    if (o.pw.length < 4) throw new Error('密碼至少 4 個字元。');
    const owner = Array.from(crypto.getRandomValues(new Uint8Array(18)), b => 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'[b % 57]).join('');
    overlay.set(.2, '加密中…');
    const args = ['--encrypt', o.pw, owner, '256', `--print=${o.print ? 'full' : 'none'}`, `--modify=${o.modify ? 'all' : 'none'}`, `--extract=${o.copy ? 'y' : 'n'}`, '--', '@in', '@out'];
    const r = await runQpdf(state.bytes, args);
    if (!r.out) throw new Error('加密失敗：' + (r.log.split('\n').pop() || '未知錯誤'));
    const allow = [o.print && '列印', o.copy && '複製', o.modify && '修改'].filter(Boolean);
    return { kind: 'file', name: baseName(state.file.name) + '_protected.pdf', blob: pdfBlob(r.out), title: '加密完成', detail: `AES-256 加密，開啟後${allow.length ? '允許' + allow.join('、') : '禁止列印、複製與修改'}` };
  },

  async compare(o) {
    const [fa, fb] = state.files;
    const [ja, jb] = [await openJs(await readBytes(fa.file)), await openJs(await readBytes(fb.file))];
    const linesA = [], linesB = [];
    for (let i = 1; i <= ja.numPages; i++) { overlay.set(.3 * i / ja.numPages, `讀取舊版第 ${i} 頁`); (await pageLines(ja, i)).lines.forEach(l => linesA.push({ t: l.text, p: i })); }
    for (let i = 1; i <= jb.numPages; i++) { overlay.set(.3 + .3 * i / jb.numPages, `讀取新版第 ${i} 頁`); (await pageLines(jb, i)).lines.forEach(l => linesB.push({ t: l.text, p: i })); }
    const norm = t => t.replace(/\s+/g, '');
    let ops = lcsDiff(linesA, linesB, (x, y) => norm(x.t) === norm(y.t));
    if (!ops) throw new Error('兩份文件太長，無法一次比較。請先分割成較少頁數再比較。');
    // pair adjacent deletions/insertions as modifications
    const rows = []; let k = 0, adds = 0, dels = 0, mods = 0;
    while (k < ops.length) {
      if (ops[k].t === '=') { rows.push({ t: '=', a: ops[k].a, b: ops[k].b }); k++; continue; }
      const del = [], ins = [];
      while (k < ops.length && ops[k].t !== '=') { (ops[k].t === '-' ? del : ins).push(ops[k]); k++; }
      const m = Math.min(del.length, ins.length);
      for (let q = 0; q < m; q++) { rows.push({ t: '~', a: del[q].a, b: ins[q].b }); mods++; }
      del.slice(m).forEach(d => { rows.push({ t: '-', a: d.a }); dels++; });
      ins.slice(m).forEach(d => { rows.push({ t: '+', b: d.b }); adds++; });
    }
    const visual = [];
    if (o.mode === 'both') {
      const np = Math.max(ja.numPages, jb.numPages);
      for (let i = 1; i <= np; i++) {
        overlay.set(.6 + .38 * i / np, `比對第 ${i} / ${np} 頁畫面`);
        if (i > ja.numPages || i > jb.numPages) { visual.push({ page: i, missing: i > ja.numPages ? 'a' : 'b' }); continue; }
        const A = await renderPageCanvas(ja, i, 72), B = await renderPageCanvas(jb, i, 72);
        const W = Math.max(A.canvas.width, B.canvas.width), H = Math.max(A.canvas.height, B.canvas.height);
        const get = c => { const x = document.createElement('canvas'); x.width = W; x.height = H; const cx = x.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H); cx.drawImage(c, 0, 0); return cx.getImageData(0, 0, W, H); };
        const da = get(A.canvas).data, dbi = get(B.canvas), db = dbi.data;
        const outC = document.createElement('canvas'); outC.width = W; outC.height = H;
        const oc = outC.getContext('2d'); const od = oc.createImageData(W, H);
        let diff = 0;
        for (let p = 0; p < da.length; p += 4) {
          const d = Math.abs(da[p] - db[p]) + Math.abs(da[p + 1] - db[p + 1]) + Math.abs(da[p + 2] - db[p + 2]);
          const g = 255 - (255 - (db[p] * .3 + db[p + 1] * .59 + db[p + 2] * .11)) * .35;
          if (d > 90) { diff++; od.data[p] = 230; od.data[p + 1] = 40; od.data[p + 2] = 70; }
          else { od.data[p] = od.data[p + 1] = od.data[p + 2] = g; }
          od.data[p + 3] = 255;
        }
        oc.putImageData(od, 0, 0);
        const ratio = diff / (W * H);
        if (ratio > 0.0003) visual.push({ page: i, ratio, canvas: outC });
      }
    }
    ja.destroy(); jb.destroy();
    return { kind: 'compare', title: rows.some(r => r.t !== '=') || visual.length ? '比較完成' : '兩份文件沒有差異', rows, adds, dels, mods, visual, names: [fa.file.name, fb.file.name], pages: [ja.numPages, jb.numPages], mode: o.mode };
  },

  async summary(o) {
    const pages = await extractAllText(state.js, i => overlay.set(.2 * i / state.js.numPages, `讀取第 ${i} 頁文字`));
    const text = pages.map((t, i) => `[第 ${i + 1} 頁]\n${t}`).join('\n\n');
    if (text.replace(/\[第 \d+ 頁\]|\s/g, '').length < 20) throw new Error('這份 PDF 裡幾乎沒有文字，可能是掃描檔，請先用「OCR 文字辨識」。');

    overlay.set(.3, 'AI 正在閱讀並整理重點…（長文件約需 30 秒到 1 分鐘）');
    const r = await aiSummarize(text, o);
    return { kind: 'text', md: true, name: baseName(state.file.name) + '_摘要.md', blob: new Blob(['﻿' + r.text], { type: 'text/markdown' }), text: r.text, title: '摘要完成', detail: `${state.js.numPages} 頁 ・ 由 ${r.engine} 產生，重要決策請再核對原文` };

  async translate(o) {
    const js = state.js, n = js.numPages;
    const pages = [];
    for (let i = 1; i <= n; i++) { overlay.set(.1 * i / n, `分析第 ${i} 頁`); pages.push(await pageLines(js, i)); }
    const body = medianSize(pages.flatMap(p => p.lines));
    // table rows are translated row by row so each stays on its own line
    const blocks = pages.map(p => structureLines(p.lines, body, true).flatMap(b => b.table ? b.lines.map(l => ({ text: l.text, x: l.x, y: l.y, w: l.w, h: l.h, size: l.size, level: 0, lines: [l] })) : [b]));
    const flat = blocks.flatMap((bs, pi) => bs.map(b => ({ pi, b })));
    if (!flat.length) throw new Error('這份 PDF 裡找不到文字，可能是掃描檔，請先用「OCR 文字辨識」。');
    const total = flat.reduce((s, x) => s + x.b.text.length, 0);
    if (total > 300000) throw new Error('文件太長（超過 30 萬字），請先分割成較小的檔案再翻譯。');
    overlay.set(.12, 'AI 翻譯中…');
    const { items, engine } = await aiTranslateItems(flat.map(x => x.b.text), o.lang, f => overlay.set(.12 + .7 * f, `AI 翻譯中… ${Math.round(f * 100)}%`));
    flat.forEach((x, k) => { x.b.tr = items[k]; });

const RD_PATTERNS = { id: /[A-Z][12489]\d{8}/g, phone: /(?:\+?886[-\s]?|0)9\d{2}[-\s]?\d{3}[-\s]?\d{3}|\(?0\d{1,2}\)?[-\s]?\d{3,4}[-\s]?\d{4}/g, email: /[\w.+-]+@[\w-]+(\.[\w-]+)+/g };
function bindRedactOpts() {
  const run = async re => {
    overlay.show('搜尋中');
    let hits = 0;
    try {
      for (let i = 0; i < state.js.numPages; i++) {
        overlay.set(i / state.js.numPages, `搜尋第 ${i + 1} 頁`);
        const { lines } = await pageLines(state.js, i + 1);
        for (const l of lines) {
          let str = '', map = [];
          l.items.forEach(it => { for (let c = 0; c < it.str.length; c++) { map.push({ it, c }); } str += it.str; });

    } finally { overlay.hide(); }
    drawItems();
    toast(hits ? `找到並標記了 ${hits} 處，請逐頁確認` : '沒有找到符合的文字');
  };
  $('#rdFind').addEventListener('click', () => { const q = $('#rd-q').value.trim(); if (!q) { toast('請輸入要搜尋的文字'); return; } run(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi')); });

      if (x.type === 'text') { const v = $('#' + id).value; x.f.setText(v || undefined); if (v && wide(v)) cjkFields.push({ x, v }); }
      else if (x.type === 'check') $('#' + id).checked ? x.f.check() : x.f.uncheck();
      else if (x.type === 'select' || x.type === 'list') { const v = $('#' + id).value; if (v) x.f.select(v); else x.f.clear(); }
      else if (x.type === 'radio') { const r = $(`input[name="${id}"]:checked`); if (r) x.f.select(r.value); }
    } catch (e) { console.warn('field', x.raw, e); }
  });
  // Helvetica can't draw CJK: for those fields either draw the text as an image (flatten) or let the viewer regenerate it.
  const strip = [];
  for (const { x, v } of cjkFields) {
    form.markFieldAsClean(x.f.ref);
    for (const w of x.f.acroField.getWidgets()) {
      if (o.flatten) {
        const r = w.getRectangle(); const pr = w.P(); const page = doc.getPages().find(p => String(p.ref) === String(pr)) || doc.getPages()[x.page];
        const size = Math.min(12, r.height * .65);
        const im = await textBoxImage(v, { size, width: x.f.isMultiline() ? r.width - 4 : null, color: '#111' });
        const img = await doc.embedPng(im.bytes);
        const sc = Math.min(1, (r.width - 4) / im.w, (r.height - 2) / im.h);
        page.drawImage(img, { x: r.x + 2, y: r.y + (x.f.isMultiline() ? r.height - im.h * sc - 1 : (r.height - im.h * sc) / 2), width: im.w * sc, height: im.h * sc });
      } else strip.push(w);
    }
    if (o.flatten) form.removeField(x.f);
  }
  if (cjkFields.length && !o.flatten) {
    form.acroForm.dict.set(PDFName.of('NeedAppearances'), L.PDFBool.True);
    form.updateFieldAppearances(); // Latin fields only; CJK ones were marked clean above
    strip.forEach(w => w.dict.delete(PDFName.of('AP'))); // stale appearance would show the old value
  }
  if (o.flatten) form.flatten();
  const bytes = await doc.save({ updateFieldAppearances: !(cjkFields.length && !o.flatten) });
  state.formDoc = await PDFDocument.load(bytes); // keep editable copy fresh if user goes back
  return { kind: 'file', name: baseName(state.file.name) + '_filled.pdf', blob: pdfBlob(bytes), title: '表單已儲存', detail: o.flatten ? '欄位已鎖定成文件內容' : '欄位仍可在其他 PDF 閱讀器中修改' };
}

/* ================= compare result ================= */
function compareHtml(r) {
  const rows = r.rows;
  const changed = rows.some(x => x.t !== '=');
  let txt = '';
  if (changed) {
    // show changes with up to 2 lines of context
    const keep = new Set();
    rows.forEach((x, i) => { if (x.t !== '=') for (let k = i - 2; k <= i + 2; k++) keep.add(k); });
    let gap = false;
    rows.forEach((x, i) => {
      if (!keep.has(i)) { if (!gap) txt += `<div class="df-gap">⋯</div>`; gap = true; return; }
      gap = false;
      if (x.t === '=') txt += `<div class="df-row"><div>${esc(x.a.t)}</div><div>${esc(x.b.t)}</div></div>`;
      else if (x.t === '-') txt += `<div class="df-row df-del"><div><span class="pg">p${x.a.p}</span>${esc(x.a.t)}</div><div></div></div>`;
      else if (x.t === '+') txt += `<div class="df-row df-add"><div></div><div><span class="pg">p${x.b.p}</span>${esc(x.b.t)}</div></div>`;
      else { const d = inlineDiff(x.a.t, x.b.t) || { a: `<del>${esc(x.a.t)}</del>`, b: `<ins>${esc(x.b.t)}</ins>` }; txt += `<div class="df-row df-mod"><div><span class="pg">p${x.a.p}</span>${d.a}</div><div><span class="pg">p${x.b.p}</span>${d.b}</div></div>`; }
    });
  }
  return `
    <div class="cmp">
      <div class="cmp-stats"><span class="saving" style="background:#E9F8F6">新增 ${r.adds} 行</span><span class="saving" style="background:var(--danger-bg);color:var(--danger)">刪除 ${r.dels} 行</span><span class="saving" style="background:#FFF6DC;color:#7A5A00">修改 ${r.mods} 行</span>${r.mode === 'both' ? `<span class="saving" style="background:var(--mist);color:var(--purple)">畫面不同 ${r.visual.length} 頁</span>` : ''}</div>
      <h3>文字差異</h3>
      ${changed ? `<div class="df"><div class="df-row df-head"><div>舊版：${esc(r.names[0])}（${r.pages[0]} 頁）</div><div>新版：${esc(r.names[1])}（${r.pages[1]} 頁）</div></div>${txt}</div>` : '<p class="notice">文字內容完全相同。</p>'}
      ${r.mode === 'both' ? `<h3>畫面差異</h3>${r.visual.length ? `<p class="help" style="color:var(--muted);font-size:14px">紅色是兩個版本畫面不同的地方（以新版為底）。</p><div class="cmp-vis">${r.visual.map((v, i) => `<figure>${v.missing ? `<div class="notice">${v.missing === 'a' ? '舊版沒有這一頁（新增頁）' : '新版沒有這一頁（刪除頁）'}</div>` : `<div data-vis="${i}"></div>`}<figcaption>第 ${v.page} 頁${v.ratio ? `・差異 ${(v.ratio * 100).toFixed(2)}%` : ''}</figcaption></figure>`).join('')}</div>` : '<p class="notice">每一頁的畫面都相同。</p>'}` : ''}
    </div>`;
}
async function compareReport(r) {
  const out = await PDFDocument.create();
  const head = await textBoxImage(`PDF 比較報告\n舊版：${r.names[0]}\n新版：${r.names[1]}\n新增 ${r.adds} 行、刪除 ${r.dels} 行、修改 ${r.mods} 行${r.mode === 'both' ? `、畫面不同 ${r.visual.length} 頁` : ''}`, { size: 13, width: 500, color: '#2E2640' });
  let pg = out.addPage(PAGE_SIZES.a4), y = 800;
  pg.drawImage(await out.embedPng(head.bytes), { x: 48, y: y - head.h, width: head.w, height: head.h }); y -= head.h + 16;
  const lines = r.rows.filter(x => x.t !== '=').map(x => x.t === '-' ? ['− ', x.a.t, '#B3364A', x.a.p] : x.t === '+' ? ['+ ', x.b.t, '#1D6E66', x.b.p] : ['~ ', `${x.a.t}  →  ${x.b.t}`, '#7A5A00', x.b.p]);
  for (const [sign, t, col, p] of lines.slice(0, 600)) {
    const im = await textBoxImage(`${sign}p${p}  ${t}`, { size: 9.5, width: 500, color: col });
    if (y - im.h < 48) { pg = out.addPage(PAGE_SIZES.a4); y = 800; }
    pg.drawImage(await out.embedPng(im.bytes), { x: 48, y: y - im.h, width: im.w, height: im.h }); y -= im.h + 3;
  }
  for (const v of r.visual.filter(v => v.canvas)) {
    const img = await out.embedJpg(await canvasBytes(v.canvas, 'image/jpeg', .85));
    const p2 = out.addPage([v.canvas.width, v.canvas.height + 24]);
    p2.drawImage(img, { x: 0, y: 0, width: v.canvas.width, height: v.canvas.height });
    const cap = await textBoxImage(`第 ${v.page} 頁・紅色為差異`, { size: 10, color: '#2E2640' });
    p2.drawImage(await out.embedPng(cap.bytes), { x: 6, y: v.canvas.height + 4, width: cap.w, height: cap.h });
  }
  return pdfBlob(await out.save());
}

// minimal Markdown → HTML for previews (headings, lists, bold, tables, paragraphs)
function mdToHtml(md) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = md.split('\n'); let html = '', list = null, k = 0;
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  while (k < lines.length) {
    const l = lines[k];
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[k + 1] || '')) {
      closeList(); const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      html += `<table><thead><tr>${cells(l).map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>`; k += 2;
      while (k < lines.length && /^\s*\|.*\|\s*$/.test(lines[k])) { html += `<tr>${cells(lines[k]).map(c => `<td>${inline(c)}</td>`).join('')}</tr>`; k++; }
      html += '</tbody></table>'; continue;
    }
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)/))) { closeList(); html += `<h${Math.min(4, m[1].length + 1)}>${inline(m[2])}</h${Math.min(4, m[1].length + 1)}>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; } html += `<li>${inline(m[1])}</li>`; }
    else if (/^---+$/.test(l.trim())) { closeList(); html += '<hr>'; }
    else if (l.trim()) { closeList(); html += `<p>${inline(l)}</p>`; }
    else closeList();
    k++;
  }
  closeList();
  return html;
}

/* ================= result ================= */
function renderResult(r) {
  const t = state.tool;
  const stats = r.before ? `<div class="stats num"><span>原始 <b>${fmtSize(r.before)}</b></span><span>→</span><span>壓縮後 <b>${fmtSize(r.after)}</b></span>${r.after < r.before ? `<span class="saving">省下 ${Math.round((1 - r.after / r.before) * 100)}%</span>` : ''}</div>` : '';
  const next = (NEXT[t.id] || []).map(id => byId[id]).filter(Boolean);
  const textBlock = r.kind === 'text' ? (r.md
    ? `<div class="seg" style="width:min(280px,100%)"><label><input type="radio" name="tview" value="preview" checked>預覽</label><label><input type="radio" name="tview" value="raw">原始文字</label></div>
       <div class="mdprev" id="mdprev">${mdToHtml(r.text)}</div><textarea class="textprev" id="txt" readonly aria-label="結果文字" hidden>${esc(r.text)}</textarea>`
    : `<textarea class="textprev" id="txt" readonly aria-label="擷取的文字">${esc(r.text)}</textarea>`) : '';
  let primary;
  if (r.kind === 'print') primary = `<button class="btn btn-primary" id="reprint" type="button">再開一次列印視窗</button>`;
  else if (r.kind === 'compare') primary = `<button class="btn btn-primary" id="save" type="button">下載比較報告（PDF）</button>`;
  else primary = `<button class="btn btn-primary" id="save" type="button">下載 ${esc(r.name)}</button>`;
  $('#stage').innerHTML = `
    <div class="result${r.kind === 'compare' ? ' wide' : ''}">
      <svg class="ok" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M73.6 17.7 A44 44 0 1 0 102 46" fill="none" stroke="#603E8D" stroke-width="6" stroke-linecap="round"/>
        <path d="M38 62 C37 72 44 77 52 76.5 C64 75.5 74 65 83 51 C72 61 60 68.5 50 69 C44 69.3 40 66.5 38 62 Z" fill="#36C2B4"/>
        <use href="#spark" x="88" y="10" width="20" height="20"/>
      </svg>
      <h2>${esc(r.title)}</h2>
      ${r.detail ? `<p style="color:var(--muted)">${esc(r.detail)}</p>` : ''}
      ${stats}
      ${textBlock}
      ${r.kind === 'compare' ? compareHtml(r) : ''}
      <div class="row">
        ${primary}
        ${r.kind === 'text' ? `<button class="btn btn-secondary" id="copy" type="button">複製文字</button>` : ''}
      </div>
      <div class="row">
        <button class="btn btn-ghost" id="again" type="button">再處理一份</button>
      </div>
      ${next.length ? `<div class="next"><h3>下一步可以</h3><div class="grid">${next.map(n => `<a class="tool-card" href="#${n.id}"><div class="ico">${ICONS[n.id]}</div><h3>${n.name}</h3></a>`).join('')}</div></div>` : ''}
    </div>`;
  if (r.kind === 'compare') {
    $$('[data-vis]').forEach(el => { const c = r.visual[+el.dataset.vis].canvas; c.style.maxWidth = '100%'; c.style.height = 'auto'; el.appendChild(c); });
    $('#save').addEventListener('click', async () => {
      overlay.show('產生報告');
      try { const blob = await compareReport(r); overlay.hide(); saveFile('compare_report.pdf', blob); }
      catch (e) { overlay.hide(); toast('報告產生失敗'); console.error(e); }
    });
  } else if (r.kind === 'print') {
    $('#reprint').addEventListener('click', () => run());
  } else $('#save').addEventListener('click', () => saveFile(r.name, r.blob));
  $('#again').addEventListener('click', () => { resetState(t); renderDrop(); window.scrollTo(0, 0); });
  if (r.kind === 'text') {
    $('#copy').addEventListener('click', () => {
      const ta = $('#txt');
      navigator.clipboard.writeText(r.text).then(() => toast('已複製'), () => { ta.hidden = false; ta.focus(); ta.select(); toast('請按 Ctrl+C（或 ⌘C）複製選取的文字'); });
    });
    $$('input[name="tview"]').forEach(x => x.addEventListener('change', () => { const raw = x.value === 'raw' && x.checked; $('#txt').hidden = !raw; $('#mdprev').hidden = raw; }));
  }
}

/* ================= mobile menu ================= */
(() => {
  const header = $('.site-header'), btn = $('#menuBtn');
  const src = $('.avatar-frame img');
  if (src) { const im = new Image(); im.src = src.src; im.alt = ''; $('#ncImg').appendChild(im); }
  const set = open => { header.classList.toggle('open', open); btn.setAttribute('aria-expanded', String(open)); btn.setAttribute('aria-label', open ? '關閉選單' : '開啟選單'); };
  btn.addEventListener('click', () => set(!header.classList.contains('open')));
  $('#mainNav').addEventListener('click', e => { if (e.target.closest('a')) set(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });
  document.addEventListener('click', e => { if (!header.contains(e.target)) set(false); });
  window.addEventListener('hashchange', () => set(false));
})();

/* ================= boot ================= */
if (!window.PDFLib || !window.pdfjsLib || !window.JSZip) {
  app.innerHTML = `<div class="wrap" style="padding-block:48px"><p class="notice error">處理 PDF 的元件沒有載入成功，請確認網路連線後重新整理頁面。</p></div>`;
} else {
  route();
  getDownloads();
}
})();
