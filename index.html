<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="秉軒老師的 PDF 工具箱：合併、分割、壓縮、旋轉、轉檔、浮水印與頁碼，檔案只在你的瀏覽器裡處理。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<title>秉軒老師的 PDF 工具箱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: light, airy brand world (CIS 60/30/10). Mist-violet hero band with 37° rhythm lines,
   a tool grid of rounded single-line icons, and a two-column workspace (canvas + options) per tool.
   Single light theme on purpose: the brand book asks for bright, light pages and rules out dark tech looks. */
:root {
  --purple: #603E8D;      /* 效能紫：主色、標題、線條 */
  --purple-80: #806599;
  --purple-20: #DFD8E8;
  --yellow: #FFC94A;      /* 火花黃：唯一的行動按鈕 */
  --teal: #36C2B4;        /* 清新青：上升勾、完成狀態 */
  --mist: #EFEAF7;        /* 晨霧紫：大面積底色 */
  --ink: #2E2640;         /* 墨紫：內文 */
  --white: #FFFFFF;       /* 雲白 */
  --muted: #615878;
  --line: #E3DCEE;
  --danger: #B3364A;
  --danger-bg: #FBEDEF;

  --font-latin: "Nunito", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-body: "Nunito", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;

  --radius: 14px;
  --radius-sm: 10px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--white); color: var(--ink); }
body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--white); }
h1, h2, h3 { color: var(--purple); text-wrap: balance; letter-spacing: .03em; line-height: 1.35; margin: 0; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--purple); }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.num { font-family: var(--font-latin); font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--white) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.site-header .wrap { display: flex; align-items: center; gap: 24px; min-height: 68px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--purple); flex-shrink: 0; }
.brand svg { width: 40px; height: 40px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text b { font-size: 17px; letter-spacing: .04em; }
.brand-text small { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.main-nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.avatar { position: relative; display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; padding: 4px 0; }
.avatar-label { font-size: 13px; font-weight: 700; color: var(--purple); line-height: 1.3; text-align: right; }
.avatar-frame { position: relative; width: 60px; height: 60px; border-radius: 50%; overflow: hidden; display: block; background: var(--mist); }
.avatar-frame img, .avatar-frame svg { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.avatar-arc { position: absolute; right: -6px; top: -2px; width: 72px; height: 72px; pointer-events: none; transition: transform .3s; }
.avatar-spark { position: absolute; right: -6px; top: -2px; width: 14px; height: 14px; }
.avatar:hover .avatar-arc { transform: rotate(-20deg); }
@media (prefers-reduced-motion: reduce) { .avatar-arc { transition: none; } }
.main-nav a {
  text-decoration: none; color: var(--ink); font-size: 15px; font-weight: 500;
  padding: 6px 14px; border-radius: 999px;
}
.main-nav a:hover { background: var(--mist); color: var(--purple); }
@media (max-width: 720px) { .main-nav { display: none; } .avatar { margin-left: auto; } .avatar-label { display: none; } }

/* ---------- hero ---------- */
.hero { background: var(--mist); position: relative; overflow: hidden; }
.hero .wrap { position: relative; padding-block: 56px 48px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: center; }
.hero h1 { font-size: clamp(30px, 4.4vw, 44px); }
.hero h1 .accent { color: var(--ink); }
.hero p.lead { margin-top: 14px; font-size: 18px; max-width: 34em; color: var(--ink); }
.hero-facts { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 22px; font-size: 15px; color: var(--muted); }
.hero-facts span { display: inline-flex; align-items: center; gap: 8px; }
.hero-facts svg { width: 18px; height: 18px; flex-shrink: 0; }
.flow { display: flex; align-items: flex-start; gap: 6px; list-style: none; margin: 0; padding: 0; counter-reset: f; }
.flow li { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 96px; text-align: center; }
.flow .disc { position: relative; width: 84px; height: 84px; border-radius: 50%; background: var(--white); display: grid; place-items: center; box-shadow: 0 6px 18px -12px rgba(96, 62, 141, .6); }
.flow .disc svg { width: 40px; height: 40px; }
.flow .disc::before { counter-increment: f; content: counter(f); position: absolute; top: -4px; left: -4px; width: 26px; height: 26px; border-radius: 50%; background: var(--purple); color: var(--white); font: 800 14px/26px var(--font-latin); }
.flow li:last-child .disc::before { background: var(--yellow); color: var(--ink); }
.flow b { font-size: 15px; color: var(--purple); letter-spacing: .04em; }
.flow .arrow { width: 34px; height: 84px; display: grid; place-items: center; }
.flow .arrow svg { width: 30px; height: 30px; }
.rhythm { position: absolute; right: -40px; bottom: -30px; width: 420px; height: 220px; pointer-events: none; opacity: .5; }
@media (max-width: 760px) {
  .hero .wrap { grid-template-columns: 1fr; padding-block: 36px 32px; }
  .flow { justify-content: center; }
  .flow li { width: 84px; }
  .flow .disc { width: 68px; height: 68px; }
  .flow .disc svg { width: 32px; height: 32px; }
  .flow .arrow { width: 22px; height: 68px; }
}

/* ---------- tool grid ---------- */
.tools-section { padding-block: 48px 64px; }
.group { margin-top: 36px; }
.group:first-child { margin-top: 0; }
.group-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 16px; }
.group-head h2 { font-size: 22px; }
.group-head p { color: var(--muted); font-size: 15px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.tool-card {
  display: flex; flex-direction: column; gap: 10px; text-align: left;
  padding: 20px 20px 22px; border: 1.5px solid var(--line); border-radius: var(--radius);
  background: var(--white); text-decoration: none; color: var(--ink);
  transition: border-color .15s, transform .15s, box-shadow .15s;
  position: relative;
}
.tool-card:hover { border-color: var(--purple); transform: translateY(-2px); box-shadow: 0 8px 22px -14px rgba(96, 62, 141, .55); }
.tool-card .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--mist); display: grid; place-items: center; }
.tool-card .ico svg { width: 26px; height: 26px; }
.tool-card h3 { font-size: 17px; }
.tool-card p { font-size: 14px; color: var(--muted); line-height: 1.6; }
.pill {
  position: absolute; top: 16px; right: 16px; font-size: 12px; font-weight: 600; letter-spacing: .06em;
  padding: 2px 10px; border-radius: 999px; background: var(--mist); color: var(--purple);
}

/* ---------- training referral ---------- */
.services { background: var(--mist); padding-block: 36px 40px; }
.services-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; margin-bottom: 20px; }
.services-head h2 { font-size: 22px; }
.services-head p { color: var(--muted); font-size: 15px; margin-top: 2px; }
.btn-primary.btn-sm { padding: 9px 20px; font-size: 15px; }
.asks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; }
.asks a { height: 100%; display: flex; flex-direction: column; gap: 6px; background: var(--white); border-radius: var(--radius); padding: 16px; text-decoration: none; color: var(--ink); border: 1.5px solid transparent; transition: border-color .15s; }
.asks a:hover { border-color: var(--purple); }
.asks .if { font-size: 12px; font-weight: 700; color: var(--teal); letter-spacing: .08em; }
.asks .q { font-size: 15px; font-weight: 600; line-height: 1.55; }
.asks .topic { margin-top: auto; padding-top: 6px; font-size: 13px; color: var(--purple); font-weight: 700; }
@media (max-width: 1000px) { .asks { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .asks { grid-template-columns: 1fr; } }

/* ---------- footer ---------- */
.site-footer { background: var(--purple); color: var(--white); }
.site-footer .wrap { padding-block: 28px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 32px; align-items: center; font-size: 14px; }
.site-footer .slogan b { display: block; font-size: 17px; letter-spacing: .04em; }
.site-footer .slogan span { color: var(--yellow); font-family: var(--font-latin); font-weight: 600; }
.site-footer small { color: var(--purple-20); }

/* ---------- tool view ---------- */
.tool-view { padding-block: 32px 64px; }
.crumb { font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.crumb:hover { color: var(--purple); }
.tool-head { display: flex; gap: 16px; align-items: center; margin: 14px 0 26px; }
.tool-head .ico { width: 56px; height: 56px; border-radius: 16px; background: var(--mist); display: grid; place-items: center; flex-shrink: 0; }
.tool-head .ico svg { width: 32px; height: 32px; }
.tool-head h1 { font-size: clamp(26px, 3.4vw, 34px); }
.tool-head p { color: var(--muted); margin-top: 2px; }

.drop {
  position: relative; border: 2px dashed var(--purple-80); border-radius: 22px;
  background: var(--mist); padding: 56px 24px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  transition: background .15s, border-color .15s;
}
.drop.over { background: var(--purple-20); border-color: var(--purple); }
.drop svg.big { width: 76px; height: 76px; }
.drop h2 { font-size: 22px; }
.drop p { color: var(--muted); font-size: 15px; }
.drop .hint { font-size: 13px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 999px; padding: 12px 26px; font-size: 16px; font-weight: 700;
  cursor: pointer; text-decoration: none; letter-spacing: .03em; transition: transform .12s, box-shadow .12s, background .12s;
}
.btn-primary { background: var(--yellow); color: var(--ink); box-shadow: 0 6px 16px -8px rgba(204, 150, 20, .8); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -10px rgba(204, 150, 20, .9); }
.btn-primary:disabled { background: var(--purple-20); color: var(--muted); box-shadow: none; cursor: not-allowed; transform: none; }
.btn-secondary { background: var(--white); color: var(--purple); border: 1.5px solid var(--purple); padding: 10.5px 22px; }
.btn-secondary:hover { background: var(--mist); }
.btn-ghost { background: transparent; color: var(--purple); padding: 8px 14px; font-weight: 600; font-size: 15px; }
.btn-ghost:hover { background: var(--mist); }
.btn-block { width: 100%; }
.btn-sm { padding: 6px 14px; font-size: 14px; }

.work { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
@media (max-width: 900px) { .work { grid-template-columns: 1fr; } }
.canvas { min-width: 0; }
.canvas-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; }
.canvas-bar .info { color: var(--muted); font-size: 14px; margin-right: auto; }
.panel {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 88px);
  border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--white); padding: 22px;
  display: flex; flex-direction: column; gap: 18px;
}
@media (max-width: 900px) { .panel { position: static; } }
.panel h2 { font-size: 18px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .label { font-weight: 600; font-size: 14px; color: var(--ink); }
.field .help { font-size: 13px; color: var(--muted); line-height: 1.55; }
.field input[type="text"], .field input[type="number"], .field select, .field textarea {
  font: inherit; font-size: 15px; color: var(--ink); background: var(--white);
  border: 1.5px solid var(--line); border-radius: var(--radius-sm); padding: 9px 12px; width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--purple); }
.field input[type="range"] { accent-color: var(--purple); width: 100%; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--mist); padding: 4px; border-radius: 12px; }
.seg label { position: relative; text-align: center; font-size: 14px; padding: 7px 6px; border-radius: 9px; cursor: pointer; line-height: 1.35; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--white); color: var(--purple); font-weight: 700; box-shadow: 0 1px 4px rgba(46, 38, 64, .12); }
.seg label:has(input:focus-visible) { outline: 3px solid var(--teal); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; }
.choice:has(input:checked) { border-color: var(--purple); background: var(--mist); }
.choice input { accent-color: var(--purple); margin-top: 5px; }
.choice b { display: block; font-size: 15px; color: var(--purple); }
.choice span { font-size: 13px; color: var(--muted); line-height: 1.5; }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; cursor: pointer; }
.check input { accent-color: var(--purple); width: 18px; height: 18px; }
.swatches { display: flex; gap: 10px; }
.swatches label { width: 32px; height: 32px; border-radius: 50%; cursor: pointer; border: 2px solid var(--white); box-shadow: 0 0 0 1.5px var(--line); position: relative; }
.swatches input { position: absolute; opacity: 0; }
.swatches label:has(input:checked) { box-shadow: 0 0 0 2.5px var(--purple); }
.swatches label:has(input:focus-visible) { outline: 3px solid var(--teal); outline-offset: 3px; }
.posgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 132px; padding: 8px; background: var(--mist); border-radius: 10px; aspect-ratio: 210/297; max-width: 100%; align-content: space-between; }
.posgrid label { height: 26px; border-radius: 6px; cursor: pointer; position: relative; display: grid; place-items: center; }
.posgrid label::after { content: ""; width: 14px; height: 6px; border-radius: 3px; background: var(--purple-20); }
.posgrid input { position: absolute; opacity: 0; }
.posgrid label:has(input:checked)::after { background: var(--purple); }
.posgrid label:has(input:focus-visible) { outline: 3px solid var(--teal); }
.posgrid .gap { grid-column: span 3; height: 0; }

/* file list (merge / images) */
.files { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.fcard {
  position: relative; border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--white);
  padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 8px; cursor: grab;
}
.fcard.dragging { opacity: .4; }
.fcard.drop-before { box-shadow: -4px 0 0 0 var(--teal); }
.fcard .thumb { aspect-ratio: 3/4; background: var(--mist); border-radius: 8px; display: grid; place-items: center; overflow: hidden; max-width: 100%; }
.fcard .thumb img, .fcard .thumb canvas { max-width: 100%; max-height: 100%; box-shadow: 0 1px 4px rgba(46, 38, 64, .18); background: #fff; }
.fcard .name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fcard .meta { font-size: 12px; color: var(--muted); }
.fcard .order { position: absolute; top: 6px; left: 6px; min-width: 24px; height: 24px; border-radius: 12px; background: var(--purple); color: var(--white); font-size: 12px; font-weight: 800; display: grid; place-items: center; padding: 0 6px; font-family: var(--font-latin); }
.fcard .acts { display: flex; gap: 2px; justify-content: flex-end; }
.icon-btn { border: 0; background: transparent; border-radius: 8px; width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; color: var(--purple); }
.icon-btn:hover { background: var(--mist); }
.icon-btn svg { width: 18px; height: 18px; }
.add-tile { border: 2px dashed var(--purple-20); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--purple); font-weight: 600; font-size: 14px; cursor: pointer; background: transparent; min-height: 200px; }
.add-tile:hover { border-color: var(--purple); background: var(--mist); }
.add-tile svg { width: 28px; height: 28px; }

/* page grid */
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 14px; }
.pcard { position: relative; border: 2px solid transparent; border-radius: 12px; padding: 8px; background: var(--white); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; transition: border-color .12s, background .12s; }
.pcard:hover { background: var(--mist); }
.pcard .thumb { width: 100%; aspect-ratio: 3/4; display: grid; place-items: center; }
.pcard .thumb canvas { max-width: 100%; max-height: 100%; box-shadow: 0 1px 5px rgba(46, 38, 64, .2); background: #fff; transition: transform .2s; }
.pcard .pn { font-size: 13px; color: var(--muted); font-family: var(--font-latin); font-weight: 600; }
.pcard.sel-remove { border-color: var(--danger); background: var(--danger-bg); }
.pcard.sel-remove canvas { opacity: .35; }
.pcard.sel-keep { border-color: var(--teal); background: #E9F8F6; }
.pcard .badge { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; display: none; place-items: center; color: var(--white); }
.pcard .badge svg { width: 16px; height: 16px; }
.pcard.sel-remove .badge { display: grid; background: var(--danger); }
.pcard.sel-keep .badge { display: grid; background: var(--teal); }
.pcard .acts { display: flex; gap: 2px; }
.pcard.dragging { opacity: .4; }
.pcard.drop-before { box-shadow: -4px 0 0 0 var(--teal); }
.placeholder-page { width: 70%; aspect-ratio: 210/297; background: var(--mist); border-radius: 4px; }

/* text preview */
.textprev { width: 100%; min-height: 320px; font: 14px/1.7 var(--font-body); color: var(--ink); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 16px; resize: vertical; background: var(--white); }

/* processing + result */
.overlay { position: fixed; inset: 0; background: rgba(46, 38, 64, .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.overlay-card { background: var(--white); border-radius: 22px; padding: 32px 28px; width: min(420px, 100%); text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.overlay-card h2 { font-size: 20px; }
.overlay-card p { color: var(--muted); font-size: 15px; }
.bar { width: 100%; height: 10px; background: var(--mist); border-radius: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--purple); border-radius: 5px; transition: width .2s; }
.spin { width: 64px; height: 64px; }
.spin .arc { transform-origin: 32px 32px; animation: rot 1.1s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin .arc { animation: none; } .tool-card, .btn { transition: none; } }

.result { max-width: 640px; margin: 8px auto 0; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.result .ok { width: 96px; height: 96px; }
.result h2 { font-size: 28px; }
.result .stats { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 15px; color: var(--muted); }
.result .stats b { color: var(--ink); }
.result .saving { background: #E9F8F6; color: #1D6E66; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.result .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.next { margin-top: 28px; width: 100%; text-align: left; }
.next h3 { font-size: 16px; margin-bottom: 10px; }
.next .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.next .tool-card { padding: 14px; flex-direction: row; align-items: center; gap: 12px; }
.next .tool-card .ico { width: 36px; height: 36px; flex-shrink: 0; }
.next .tool-card .ico svg { width: 22px; height: 22px; }
.next .tool-card h3 { font-size: 15px; }

// Saving: inside a claude.ai viewer use the downloads capability; elsewhere (self-hosted) a normal download link.
let dlPromise;
function getDownloads() {
  if (!dlPromise) {
    dlPromise = (window.claude && typeof window.claude.use === 'function')
      ? Promise.race([window.claude.use('downloads').catch(() => null), new Promise(r => setTimeout(() => r(null), 4000))])
      : Promise.resolve(null);
  }
  return dlPromise;
}
async function saveFile(filename, blob) {
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast('已儲存 ' + filename); }
    catch (e) {
      if (e && e.code === 'declined') toast('已取消儲存');
      else if (e && e.code === 'rate_limited') toast('上一個儲存視窗還開著，請先完成它');
      else toast('這個檢視畫面無法儲存檔案，請在瀏覽器中開啟本頁');
    }
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

}

async function renderThumb(pdf, pageNo, maxW = 160) {
  const page = await pdf.getPage(pageNo);
  const vp1 = page.getViewport({ scale: 1 });
  const scale = Math.min(maxW / vp1.width, (maxW * 1.4) / vp1.height) * (window.devicePixelRatio > 1 ? 2 : 1);
  const vp = page.getViewport({ scale });
  const c = document.createElement('canvas');
  c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  c.style.width = (c.width / (window.devicePixelRatio > 1 ? 2 : 1)) + 'px';
  page.cleanup();
  return c;
}

function parseRanges(str, total) {
  const groups = [];
  for (const raw of str.split(/[,，、\s]+/).filter(Boolean)) {
    const m = raw.match(/^(\d+)?\s*[-~–]\s*(\d+)?$/) || raw.match(/^(\d+)$/);
    if (!m) throw new Error(`看不懂「${raw}」，請用像 1-3, 5, 8- 這樣的格式。`);
    let a, b;
    if (m.length === 2) { a = b = +m[1]; } else { a = m[1] ? +m[1] : 1; b = m[2] ? +m[2] : total; }
    if (a < 1 || b > total || a > b) throw new Error(`「${raw}」超出範圍，這份檔案共 ${total} 頁。`);
    groups.push({ label: a === b ? `${a}` : `${a}-${b}`, idx: Array.from({ length: b - a + 1 }, (_, i) => a - 1 + i) });
  }
  if (!groups.length) throw new Error('請輸入至少一個頁碼範圍。');
  return groups;
}

// Text → transparent PNG via canvas, so Chinese renders without embedding a CJK font in the PDF.
async function textImage(text, { size, color, opacity = 1, angle = 0, weight = 700 }) {
  const k = 4;
  const font = `${weight} ${size * k}px "Noto Sans TC", "Nunito", "PingFang TC", "Microsoft JhengHei", sans-serif`;
  try { await document.fonts.load(font, text); } catch (_) {}
  const m = document.createElement('canvas').getContext('2d');
  m.font = font;
  const w = Math.ceil(m.measureText(text).width) + 8 * k, h = Math.ceil(size * k * 1.4);
  const rad = angle * Math.PI / 180;
  const W = Math.ceil(Math.abs(w * Math.cos(rad)) + Math.abs(h * Math.sin(rad)));
  const H = Math.ceil(Math.abs(w * Math.sin(rad)) + Math.abs(h * Math.cos(rad)));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.translate(W / 2, H / 2); ctx.rotate(-rad);
  ctx.font = font; ctx.fillStyle = color; ctx.globalAlpha = opacity;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, 0);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  return { bytes: new Uint8Array(await blob.arrayBuffer()), w: W / k, h: H / k };
}

async function onFiles(list) {
  const files = filterFiles(list);
  if (!files.length) return;
  const t = state.tool;
  if (t.multi) {
    for (const f of files) state.files.push({ id: Math.random().toString(36).slice(2), file: f, thumb: null, pages: null, err: null });
    renderWork();
    loadFileThumbs();

    overlay.show('讀取檔案');
    try {
      const bytes = await readBytes(files[0]);
      await loadPdf(bytes); // validates + detects encryption
      state.file = files[0]; state.bytes = bytes;
      state.js = await openJs(bytes);
      state.pages = Array.from({ length: state.js.numPages }, (_, i) => ({ i, rot: 0, sel: false, canvas: null }));
      overlay.hide();
      renderWork();
      loadPageThumbs();
    } catch (e) { overlay.hide(); toast(e.message || '讀取失敗'); }
  }
}

/* ---------- workspace ---------- */
function renderWork() {
  const t = state.tool;
  const stage = $('#stage');
  stage.innerHTML = `
    <div class="work">
      <div class="canvas" id="canvas"></div>
      <aside class="panel" aria-label="設定">
        <h2>設定</h2>
        <form id="opts" class="opts" style="display:flex;flex-direction:column;gap:18px">${optionsHtml(t)}</form>
        <div id="msg"></div>
        <button class="btn btn-primary btn-block" id="go" type="button">${t.cta} →</button>
        <button class="btn btn-ghost btn-block" id="restart" type="button">換一份檔案</button>
      </aside>
    </div>`;
  $('#go').addEventListener('click', run);
  $('#restart').addEventListener('click', () => { resetState(t); renderDrop(); });
  $('#opts').addEventListener('submit', e => e.preventDefault());
  $('#opts').addEventListener('input', onOptsChange);
  onOptsChange();
  renderCanvas();
}

function onOptsChange() {
  const t = state.tool, f = $('#opts');
  if (!f) return;
  if (t.id === 'split') {
    const custom = f.mode.value === 'ranges';
    $('#f-ranges').hidden = !custom;
  }
  if (t.id === 'watermark') {
    $('#v-wm-size').textContent = f.size.value;
    $('#v-wm-op').textContent = f.opacity.value + '%';
  }
  if (t.id === 'compress') { /* nothing dynamic */ }
  updateInfo();
}

function updateInfo() {
  const t = state.tool, el = $('#info');
  if (!el) return;
  if (t.multi) {
    const n = state.files.length;
    el.textContent = n ? `${n} 個檔案${t.id === 'merge' ? '，拖曳卡片可調整合併順序' : '，拖曳卡片可調整頁序'}` : '';
  } else {
    const n = state.pages.length;
    if (t.id === 'remove') el.textContent = `共 ${n} 頁，已選 ${state.pages.filter(p => p.sel).length} 頁要刪除`;
    else if (t.id === 'extract') el.textContent = `共 ${n} 頁，已選 ${state.pages.filter(p => p.sel).length} 頁要保留`;
    else if (t.id === 'organize') el.textContent = `共 ${n} 頁，拖曳可調整順序`;
    else if (t.id === 'rotate') el.textContent = `共 ${n} 頁，點一下頁面即可旋轉`;
    else el.textContent = `${state.file.name} ・ ${state.js.numPages} 頁 ・ ${fmtSize(state.file.size)}`;
  }
  const go = $('#go');
  if (go) {
    let disabled = false;
    if (t.multi) disabled = t.id === 'merge' ? state.files.length < 2 : state.files.length < 1;
    if (t.id === 'remove') disabled = !state.pages.some(p => p.sel) || state.pages.every(p => p.sel);
    if (t.id === 'extract') disabled = !state.pages.some(p => p.sel);
    if (t.id === 'organize') disabled = state.pages.length === 0;
    go.disabled = disabled;
    const msg = $('#msg');
    if (msg) {
      let m = '';
      if (t.id === 'merge' && state.files.length === 1) m = '再加入至少一份 PDF 才能合併。';
      if (t.id === 'remove' && state.pages.length && state.pages.every(p => p.sel)) m = '不能刪除全部頁面，至少保留一頁。';
      msg.innerHTML = m ? `<p class="notice">${m}</p>` : '';
    }
  }
}

/* ---------- canvas: file list or page grid ---------- */
function renderCanvas() {
  const t = state.tool, c = $('#canvas');
  if (t.multi) {
    c.innerHTML = `<div class="canvas-bar"><span class="info" id="info"></span><button type="button" class="btn btn-secondary btn-sm" id="addMore">${ICONS.plus.replace('<svg', '<svg width="16" height="16"')}加入檔案</button></div>
      <ul class="files" id="files"></ul>`;
    $('#addMore').addEventListener('click', () => pickFiles(true, onFiles));
    renderFiles();
  } else if (['remove', 'extract', 'organize', 'rotate'].includes(t.id)) {
    c.innerHTML = `<div class="canvas-bar"><span class="info" id="info"></span></div><div class="pages" id="pages"></div>`;
    renderPages();
    bindPageOpts();
  } else {
    c.innerHTML = `<div class="canvas-bar"><span class="info" id="info"></span></div><div class="pages" id="pages"></div>`;
    renderPages(true);
  }
  updateInfo();
  // drop more files directly onto the workspace
  c.addEventListener('dragover', e => { if (t.multi) e.preventDefault(); });
  c.addEventListener('drop', e => { if (t.multi && e.dataTransfer.files.length) { e.preventDefault(); onFiles([...e.dataTransfer.files]); } });
}

function renderFiles() {
  const ul = $('#files'), t = state.tool;
  ul.innerHTML = state.files.map((f, i) => `
    <li class="fcard" draggable="true" data-i="${i}">
      <span class="order">${i + 1}</span>
      <div class="thumb" data-thumb="${f.id}"></div>
      <div class="name" title="${esc(f.file.name)}">${esc(f.file.name)}</div>
      <div class="meta num">${f.err ? `<span style="color:var(--danger)">${esc(f.err)}</span>` : (f.pages ? f.pages + ' 頁 ・ ' : '') + fmtSize(f.file.size)}</div>
      <div class="acts">
        <button type="button" class="icon-btn" data-mv="-1" aria-label="往前移" ${i === 0 ? 'disabled' : ''}>${ICONS.up}</button>
        <button type="button" class="icon-btn" data-mv="1" aria-label="往後移" ${i === state.files.length - 1 ? 'disabled' : ''}>${ICONS.down}</button>
        <button type="button" class="icon-btn" data-del aria-label="移除">${ICONS.x}</button>
      </div>
    </li>`).join('') + `<li><button type="button" class="add-tile" id="addTile" style="width:100%">${ICONS.plus}加入${t.input === 'image' ? '圖片' : 'PDF'}</button></li>`;
  state.files.forEach(f => { if (f.thumb) ul.querySelector(`[data-thumb="${f.id}"]`).appendChild(f.thumb); });
  $('#addTile').addEventListener('click', () => pickFiles(true, onFiles));
  $$('.fcard', ul).forEach(li => {
    const i = +li.dataset.i;
    li.querySelector('[data-mv="-1"]').addEventListener('click', () => moveFile(i, i - 1));
    li.querySelector('[data-mv="1"]').addEventListener('click', () => moveFile(i, i + 1));
    li.querySelector('[data-del]').addEventListener('click', () => { state.files.splice(i, 1); renderFiles(); updateInfo(); });
  });
  enableDragSort(ul, '.fcard', (from, to) => moveFile(from, to));
  updateInfo();
}
function moveFile(from, to) {
  if (to < 0 || to >= state.files.length || from === to) return;
  const [f] = state.files.splice(from, 1); state.files.splice(to, 0, f); renderFiles();
}

async function loadFileThumbs() {
  for (const f of state.files) {
    if (f.thumb || f.err || f.loading) continue;
    f.loading = true;
    try {
      if (state.tool.input === 'image') {
        const img = new Image(); img.src = URL.createObjectURL(f.file); img.alt = '';
        await img.decode(); f.thumb = img;
      } else {
        const bytes = await readBytes(f.file);
        await loadPdf(bytes);
        const js = await openJs(bytes);
        f.pages = js.numPages;
        f.thumb = await renderThumb(js, 1, 140);
        js.destroy();
      }
    } catch (e) { f.err = e.message || '無法讀取'; }
    const holder = document.querySelector(`[data-thumb="${f.id}"]`);
    if (holder) renderFiles();
  }
}

function enableDragSort(container, sel, onMove) {
  let from = null;
  $$(sel, container).forEach(el => {
    el.addEventListener('dragstart', e => { from = +el.dataset.i; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(from)); } catch (_) {} });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); $$('.drop-before', container).forEach(x => x.classList.remove('drop-before')); });
    el.addEventListener('dragover', e => { if (from === null) return; e.preventDefault(); e.stopPropagation(); $$('.drop-before', container).forEach(x => x.classList.remove('drop-before')); el.classList.add('drop-before'); });
    el.addEventListener('drop', e => {
      if (from === null) return;
      e.preventDefault(); e.stopPropagation();
      let to = +el.dataset.i; if (from < to) to -= 1;
      const f = from; from = null; onMove(f, to);
    });
  });
}

/* page grid */
function renderPages(previewOnly = false) {
  const t = state.tool, box = $('#pages');
  const showCount = previewOnly ? Math.min(state.pages.length, 24) : state.pages.length;
  box.innerHTML = state.pages.slice(0, showCount).map((p, k) => {
    const cls = t.id === 'remove' && p.sel ? 'sel-remove' : t.id === 'extract' && p.sel ? 'sel-keep' : '';
    const acts = t.id === 'organize' ? `<div class="acts">
        <button type="button" class="icon-btn" data-a="left" aria-label="往前移">${ICONS.up}</button>
        <button type="button" class="icon-btn" data-a="rot" aria-label="旋轉">${ICONS.rotR}</button>
        <button type="button" class="icon-btn" data-a="del" aria-label="刪除此頁">${ICONS.x}</button>
        <button type="button" class="icon-btn" data-a="right" aria-label="往後移">${ICONS.down}</button></div>` : '';
    return `<div class="pcard ${cls}" data-i="${k}" ${t.id === 'organize' ? 'draggable="true"' : ''} ${previewOnly ? '' : 'tabindex="0" role="button"'} aria-label="第 ${p.i + 1} 頁">
      <span class="badge">${t.id === 'remove' ? ICONS.cross : ICONS.check}</span>
      <div class="thumb" data-pg="${p.i}"></div>
      <span class="pn">${p.i + 1}</span>${acts}</div>`;
  }).join('') + (showCount < state.pages.length ? `<div class="pcard" style="cursor:default;justify-content:center"><span class="pn">還有 ${state.pages.length - showCount} 頁</span></div>` : '');
  $$('.pcard[data-i]', box).forEach(el => {
    const k = +el.dataset.i, p = state.pages[k];
    const holder = el.querySelector('.thumb');
    if (p.canvas) { holder.appendChild(p.canvas); p.canvas.style.transform = `rotate(${p.rot}deg)`; }
    else holder.innerHTML = '<div class="placeholder-page"></div>';
    if (previewOnly) return;
    const act = () => {
      if (t.id === 'remove' || t.id === 'extract') { p.sel = !p.sel; el.className = 'pcard ' + (p.sel ? (t.id === 'remove' ? 'sel-remove' : 'sel-keep') : ''); updateInfo(); }
      else if (t.id === 'rotate') { p.rot = (p.rot + 90) % 360; if (p.canvas) p.canvas.style.transform = `rotate(${p.rot}deg)`; }
    };
    el.addEventListener('click', e => { if (e.target.closest('.acts')) return; act(); });
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
    if (t.id === 'organize') {
      el.querySelector('[data-a="left"]').addEventListener('click', () => movePage(k, k - 1));
      el.querySelector('[data-a="right"]').addEventListener('click', () => movePage(k, k + 1));
      el.querySelector('[data-a="rot"]').addEventListener('click', () => { p.rot = (p.rot + 90) % 360; if (p.canvas) p.canvas.style.transform = `rotate(${p.rot}deg)`; });
      el.querySelector('[data-a="del"]').addEventListener('click', () => {
        if (state.pages.length === 1) { toast('至少要保留一頁'); return; }
        state.pages.splice(k, 1); renderPages(); updateInfo();
      });
    }
  });
  if (t.id === 'organize') enableDragSort(box, '.pcard', movePage);
}
function movePage(from, to) {
  if (to < 0 || to >= state.pages.length || from === to) return;
  const [p] = state.pages.splice(from, 1); state.pages.splice(to, 0, p); renderPages();
}
function bindPageOpts() {
  const t = state.tool;
  if (t.id === 'remove') $('#clearSel').addEventListener('click', () => { state.pages.forEach(p => p.sel = false); renderPages(); updateInfo(); });
  if (t.id === 'extract') $('#applyRanges').addEventListener('click', () => {
    try {
      const groups = parseRanges($('#pick-ranges').value, state.pages.length);
      const set = new Set(groups.flatMap(g => g.idx));
      state.pages.forEach(p => p.sel = set.has(p.i)); renderPages(); updateInfo();
    } catch (e) { toast(e.message); }
  });
  if (t.id === 'organize') $('#resetOrder').addEventListener('click', () => {
    state.pages = Array.from({ length: state.js.numPages }, (_, i) => {
      const old = state.allPages ? state.allPages[i] : null;
      return { i, rot: 0, sel: false, canvas: old ? old.canvas : null };
    });
    renderPages(); updateInfo();
  });
  if (t.id === 'rotate') $$('[data-rotall]').forEach(b => b.addEventListener('click', () => {
    const d = +b.dataset.rotall;
    state.pages.forEach(p => { p.rot = (p.rot + d + 360) % 360; if (p.canvas) p.canvas.style.transform = `rotate(${p.rot}deg)`; });
  }));
}
async function loadPageThumbs() {
  state.allPages = state.pages.slice();
  const js = state.js;
  const limit = ['remove', 'extract', 'organize', 'rotate'].includes(state.tool.id) ? state.pages.length : Math.min(state.pages.length, 24);
  for (let k = 0; k < limit; k++) {
    const p = state.allPages[k];
    if (state.js !== js) return; // user switched files
    try { p.canvas = await renderThumb(js, p.i + 1, 120); } catch (_) { continue; }
    const holder = document.querySelector(`.thumb[data-pg="${p.i}"]`);
    if (holder) { holder.innerHTML = ''; holder.appendChild(p.canvas); p.canvas.style.transform = `rotate(${p.rot}deg)`; }
    if (k % 4 === 3) await tick();
  }
}

/* ================= processing ================= */
async function run() {
  const t = state.tool;
  const f = $('#opts');
  const opts = Object.fromEntries(new FormData(f).entries());
  overlay.show(t.name);
  try {
    const out = await PROCESS[t.id](opts);
    overlay.set(1, '完成');
    await tick();
    overlay.hide();
    state.result = out;
    renderResult(out);
  } catch (e) {
    overlay.hide();
    const msg = $('#msg');
    if (msg) msg.innerHTML = `<p class="notice error">${esc(e.message || '處理失敗，請再試一次。')}</p>`;
    console.error(e);
  }
}

async function copyPagesTo(out, src, specs) {
  // specs: [{i, rot}] — copies pages in this order and applies extra rotation
  const copied = await out.copyPages(src, specs.map(s => s.i));
  copied.forEach((pg, k) => {
    const extra = specs[k].rot || 0;
    if (extra) pg.setRotation(degrees((pg.getRotation().angle + extra) % 360));
    out.addPage(pg);
  });
}

const PROCESS = {
  async merge() {
    const out = await PDFDocument.create();
    const n = state.files.length;
    for (let k = 0; k < n; k++) {
      const f = state.files[k];
      overlay.set(k / n, `合併第 ${k + 1} / ${n} 個檔案：${f.file.name}`);
      const src = await loadPdf(await readBytes(f.file)).catch(e => { throw new Error(`${f.file.name}：${e.message}`); });
      await copyPagesTo(out, src, src.getPageIndices().map(i => ({ i })));
    }
    const bytes = await out.save();
    return { kind: 'file', name: 'merged.pdf', blob: pdfBlob(bytes), title: '合併完成', detail: `${n} 個檔案，共 ${out.getPageCount()} 頁` };
  },

  async split(o) {
    const src = await loadPdf(state.bytes);
    const total = src.getPageCount();
    const groups = o.mode === 'each'
      ? Array.from({ length: total }, (_, i) => ({ label: String(i + 1), idx: [i] }))
      : parseRanges(o.ranges || '', total);
    const base = baseName(state.file.name);
    const parts = [];
    for (let k = 0; k < groups.length; k++) {
      overlay.set(k / groups.length, `產生第 ${k + 1} / ${groups.length} 份`);
      const out = await PDFDocument.create();
      await copyPagesTo(out, src, groups[k].idx.map(i => ({ i })));
      parts.push({ name: `${base}_p${groups[k].label}.pdf`, bytes: await out.save() });
    }
    if (parts.length === 1) return { kind: 'file', name: parts[0].name, blob: pdfBlob(parts[0].bytes), title: '分割完成', detail: `第 ${groups[0].label} 頁` };
    const zip = new JSZip(); parts.forEach(p => zip.file(p.name, p.bytes));
    const blob = await zip.generateAsync({ type: 'blob' }, m => overlay.set(.9 + m.percent / 1000, '打包 ZIP…'));
    return { kind: 'file', name: `${base}_split.zip`, blob, title: '分割完成', detail: `拆成 ${parts.length} 份 PDF，已打包成 ZIP` };
  },

  async remove() {
    const src = await loadPdf(state.bytes);
    const keep = state.pages.filter(p => !p.sel);
    const out = await PDFDocument.create();
    await copyPagesTo(out, src, keep.map(p => ({ i: p.i })));
    return { kind: 'file', name: baseName(state.file.name) + '_edited.pdf', blob: pdfBlob(await out.save()), title: '頁面已刪除', detail: `刪除 ${state.pages.length - keep.length} 頁，剩下 ${keep.length} 頁` };
  },

  async extract() {
    const src = await loadPdf(state.bytes);
    const keep = state.pages.filter(p => p.sel);
    const out = await PDFDocument.create();
    await copyPagesTo(out, src, keep.map(p => ({ i: p.i })));
    return { kind: 'file', name: baseName(state.file.name) + '_extract.pdf', blob: pdfBlob(await out.save()), title: '擷取完成', detail: `擷取 ${keep.length} 頁` };
  },

  async organize() {
    const src = await loadPdf(state.bytes);
    const out = await PDFDocument.create();
    await copyPagesTo(out, src, state.pages.map(p => ({ i: p.i, rot: p.rot })));
    return { kind: 'file', name: baseName(state.file.name) + '_organized.pdf', blob: pdfBlob(await out.save()), title: '頁面已整理', detail: `共 ${state.pages.length} 頁` };
  },

  async rotate() {
    const src = await loadPdf(state.bytes);
    const out = await PDFDocument.create();
    await copyPagesTo(out, src, state.pages.map(p => ({ i: p.i, rot: p.rot })));
    const n = state.pages.filter(p => p.rot).length;
    return { kind: 'file', name: baseName(state.file.name) + '_rotated.pdf', blob: pdfBlob(await out.save()), title: '旋轉完成', detail: n ? `旋轉了 ${n} 頁` : '沒有頁面被旋轉，檔案內容與原本相同' };
  },

  async compress(o) {
    const before = state.file.size;
    let bytes;
    if (o.level === 'lossless') {
      overlay.set(.3, '重新整理檔案結構…');
      const src = await loadPdf(state.bytes);
      bytes = await src.save({ useObjectStreams: true });
    } else {
      const dpi = o.level === 'strong' ? 80 : 120, q = o.level === 'strong' ? .5 : .68;
      const js = state.js, n = js.numPages;
      const out = await PDFDocument.create();
      const c = document.createElement('canvas'), ctx = c.getContext('2d');
      for (let i = 1; i <= n; i++) {
        overlay.set((i - 1) / n, `壓縮第 ${i} / ${n} 頁`);
        const page = await js.getPage(i);
        const vp1 = page.getViewport({ scale: 1 }); // already includes /Rotate
        const vp = page.getViewport({ scale: dpi / 72 });
        c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        await page.render({ canvasContext: ctx, viewport: vp }).promise;
        const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
        const img = await out.embedJpg(new Uint8Array(await blob.arrayBuffer()));
        const pg = out.addPage([vp1.width, vp1.height]);
        pg.drawImage(img, { x: 0, y: 0, width: vp1.width, height: vp1.height });
        page.cleanup();
      }
      bytes = await out.save({ useObjectStreams: true });
    }
    const after = bytes.length;
    if (after >= before) {
      return { kind: 'file', name: baseName(state.file.name) + '_compressed.pdf', blob: pdfBlob(state.bytes), title: '這份檔案已經很精簡', detail: `壓縮後沒有變小，提供原檔下載。可以試試${o.level === 'strong' ? '其他程度' : '「強力壓縮」'}。`, before, after: before };
    }
    return { kind: 'file', name: baseName(state.file.name) + '_compressed.pdf', blob: pdfBlob(bytes), title: '壓縮完成', before, after };
  },

  async img2pdf(o) {
    const out = await PDFDocument.create();
    const n = state.files.length, margin = +o.margin;
    const sizes = { a4: [595.28, 841.89], letter: [612, 792] };
    for (let k = 0; k < n; k++) {
      const f = state.files[k];
      overlay.set(k / n, `加入第 ${k + 1} / ${n} 張圖片`);
      let bmp;
      try { bmp = await createImageBitmap(f.file, { imageOrientation: 'from-image' }); }
      catch (_) { throw new Error(`${f.file.name}：無法讀取這張圖片。`); }
      const maxPx = 3000, s = Math.min(1, maxPx / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
      const ctx = c.getContext('2d');
      const isPng = f.file.type === 'image/png';
      if (!isPng) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(bmp, 0, 0, c.width, c.height);
      const blob = await new Promise(r => c.toBlob(r, isPng ? 'image/png' : 'image/jpeg', .9));
      const data = new Uint8Array(await blob.arrayBuffer());
      const img = isPng ? await out.embedPng(data) : await out.embedJpg(data);
      let pw, ph;
      const landscape = c.width > c.height;
      if (o.size === 'fit') { const bw = bmp.width * .75, bh = bmp.height * .75, kk = Math.min(1, 1200 / Math.max(bw, bh)); pw = bw * kk + margin * 2; ph = bh * kk + margin * 2; }
      else { [pw, ph] = sizes[o.size]; if (landscape) [pw, ph] = [ph, pw]; }
      const aw = pw - margin * 2, ah = ph - margin * 2;
      const r = Math.min(aw / c.width, ah / c.height);
      const w = c.width * r, h = c.height * r;
      const pg = out.addPage([pw, ph]);
      pg.drawImage(img, { x: (pw - w) / 2, y: (ph - h) / 2, width: w, height: h });
      bmp.close && bmp.close();
    }
    const name = n === 1 ? baseName(state.files[0].file.name) + '.pdf' : 'images.pdf';
    return { kind: 'file', name, blob: pdfBlob(await out.save()), title: '轉換完成', detail: `${n} 張圖片，共 ${n} 頁` };
  },

  async pdf2img(o) {
    const js = state.js, n = js.numPages, dpi = +o.dpi, isJpg = o.fmt === 'jpg';
    const base = baseName(state.file.name);
    const c = document.createElement('canvas'), ctx = c.getContext('2d');
    const imgs = [];
    for (let i = 1; i <= n; i++) {
      overlay.set((i - 1) / n, `轉換第 ${i} / ${n} 頁`);
      const page = await js.getPage(i);
      const vp = page.getViewport({ scale: dpi / 72 });
      c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      imgs.push({ name: `${base}_${String(i).padStart(String(n).length, '0')}.${o.fmt}`, blob: await new Promise(r => c.toBlob(r, isJpg ? 'image/jpeg' : 'image/png', .9)) });
      page.cleanup();
    }
    if (n === 1) return { kind: 'file', name: imgs[0].name, blob: imgs[0].blob, title: '轉換完成', detail: `1 張 ${o.fmt.toUpperCase()}，${dpi} dpi` };
    const zip = new JSZip(); imgs.forEach(im => zip.file(im.name, im.blob));
    const blob = await zip.generateAsync({ type: 'blob' }, m => overlay.set(.9 + m.percent / 1000, '打包 ZIP…'));
    return { kind: 'file', name: `${base}_images.zip`, blob, title: '轉換完成', detail: `${n} 張 ${o.fmt.toUpperCase()}，${dpi} dpi，已打包成 ZIP` };
  },

  async pdf2txt() {
    const js = state.js, n = js.numPages;
    let text = '', chars = 0;
    for (let i = 1; i <= n; i++) {
      overlay.set((i - 1) / n, `讀取第 ${i} / ${n} 頁`);
      const page = await js.getPage(i);
      const tc = await page.getTextContent();
      let s = '';
      for (const it of tc.items) { if ('str' in it) { s += it.str; if (it.hasEOL) s += '\n'; } }
      s = s.replace(/[ \t]+\n/g, '\n').trim();
      chars += s.replace(/\s/g, '').length;
      text += (n > 1 ? `── 第 ${i} 頁 ──\n` : '') + s + '\n\n';
    }
    if (!chars) throw new Error('這份 PDF 裡找不到文字，可能是掃描成圖片的檔案，需要 OCR 才能辨識。');
    return { kind: 'text', name: baseName(state.file.name) + '.txt', blob: new Blob(['﻿' + text.trim()], { type: 'text/plain' }), text: text.trim(), title: '文字擷取完成', detail: `${n} 頁，約 ${chars.toLocaleString()} 字` };
  },

  async watermark(o) {
    const text = (o.text || '').trim();
    if (!text) throw new Error('請輸入浮水印文字。');
    const src = await loadPdf(state.bytes);
    const im = await textImage(text, { size: +o.size, color: o.color, opacity: +o.opacity / 100, angle: +o.angle });
    const img = await src.embedPng(im.bytes);
    const pages = src.getPages();
    pages.forEach((pg, k) => {
      overlay.set(k / pages.length, `處理第 ${k + 1} / ${pages.length} 頁`);
      const { width: W, height: H } = pg.getSize();
      const { x: ox, y: oy } = pg.getMediaBox();
      if (o.layout === 'tile') {
        const sx = im.w + 60, sy = im.h + 60;
        for (let y = oy - im.h / 2; y < oy + H; y += sy)
          for (let x = ox - im.w / 2 + ((Math.round((y - oy) / sy) % 2) ? sx / 2 : 0); x < ox + W; x += sx)
            pg.drawImage(img, { x, y, width: im.w, height: im.h });
      } else {
        const r = Math.min(1, (W * .9) / im.w, (H * .9) / im.h);
        pg.drawImage(img, { x: ox + (W - im.w * r) / 2, y: oy + (H - im.h * r) / 2, width: im.w * r, height: im.h * r });
      }
    });
    return { kind: 'file', name: baseName(state.file.name) + '_watermark.pdf', blob: pdfBlob(await src.save()), title: '浮水印已加入', detail: `${pages.length} 頁都已加上「${text}」` };
  },

  async pagenum(o) {
    const src = await loadPdf(state.bytes);
    const pages = src.getPages();
    const start = parseInt(o.start, 10) || 0, size = Math.min(36, Math.max(6, +o.size || 11));
    const skip = !!o.skipFirst;
    const total = pages.length - (skip ? 1 : 0) + start - 1;
    const fmt = (i) => ({ n: `${i}`, nN: `${i} / ${total}`, zh: `第 ${i} 頁`, zhN: `第 ${i} 頁，共 ${total} 頁`, dash: `- ${i} -` }[o.fmt]);
    const margin = 28;
    for (let k = 0; k < pages.length; k++) {
      if (skip && k === 0) continue;
      overlay.set(k / pages.length, `處理第 ${k + 1} / ${pages.length} 頁`);
      const num = start + k - (skip ? 1 : 0);
      const im = await textImage(fmt(num), { size, color: '#2E2640', weight: 500 });
      const img = await src.embedPng(im.bytes);
      const pg = pages[k];
      const { width: W, height: H } = pg.getSize();
      const { x: ox, y: oy } = pg.getMediaBox();
      const col = o.pos[1], row = o.pos[0];
      const x = col === 'l' ? margin : col === 'r' ? W - margin - im.w : (W - im.w) / 2;
      const y = row === 'b' ? margin - im.h / 2 : H - margin - im.h / 2;
      pg.drawImage(img, { x: ox + x, y: oy + y, width: im.w, height: im.h });
    }
    return { kind: 'file', name: baseName(state.file.name) + '_numbered.pdf', blob: pdfBlob(await src.save()), title: '頁碼已加入', detail: `從 ${start} 開始編號${skip ? '，封面不編號' : ''}` };
  },
};

/* ================= result ================= */
function renderResult(r) {
  const t = state.tool;
  const stats = r.before ? `<div class="stats num"><span>原始 <b>${fmtSize(r.before)}</b></span><span>→</span><span>壓縮後 <b>${fmtSize(r.after)}</b></span>${r.after < r.before ? `<span class="saving">省下 ${Math.round((1 - r.after / r.before) * 100)}%</span>` : ''}</div>` : '';
  const next = (NEXT[t.id] || []).map(id => byId[id]).filter(Boolean);
  $('#stage').innerHTML = `
    <div class="result">
      <svg class="ok" viewBox="0 0 120 120" aria-hidden="true">
        <path d="M73.6 17.7 A44 44 0 1 0 102 46" fill="none" stroke="#603E8D" stroke-width="6" stroke-linecap="round"/>
        <path d="M38 62 C37 72 44 77 52 76.5 C64 75.5 74 65 83 51 C72 61 60 68.5 50 69 C44 69.3 40 66.5 38 62 Z" fill="#36C2B4"/>
        <use href="#spark" x="88" y="10" width="20" height="20"/>
      </svg>
      <h2>${esc(r.title)}</h2>
      ${r.detail ? `<p style="color:var(--muted)">${esc(r.detail)}</p>` : ''}
      ${stats}
      ${r.kind === 'text' ? `<textarea class="textprev" id="txt" readonly aria-label="擷取的文字">${esc(r.text)}</textarea>` : ''}
      <div class="row">
        <button class="btn btn-primary" id="save" type="button">下載 ${esc(r.name)}</button>
        ${r.kind === 'text' ? `<button class="btn btn-secondary" id="copy" type="button">複製文字</button>` : ''}
      </div>
      <div class="row">
        <button class="btn btn-ghost" id="again" type="button">再處理一份</button>
      </div>
      ${next.length ? `<div class="next"><h3>下一步可以</h3><div class="grid">${next.map(n => `<a class="tool-card" href="#${n.id}"><div class="ico">${ICONS[n.id]}</div><h3>${n.name}</h3></a>`).join('')}</div></div>` : ''}
    </div>`;
  $('#save').addEventListener('click', () => saveFile(r.name, r.blob));
  $('#again').addEventListener('click', () => { resetState(t); renderDrop(); window.scrollTo(0, 0); });
  if (r.kind === 'text') $('#copy').addEventListener('click', () => {
    const ta = $('#txt');
    navigator.clipboard.writeText(r.text).then(() => toast('已複製'), () => { ta.focus(); ta.select(); toast('請按 Ctrl+C（或 ⌘C）複製選取的文字'); });
  });
}

/* ================= boot ================= */
if (!window.PDFLib || !window.pdfjsLib || !window.JSZip) {
  app.innerHTML = `<div class="wrap" style="padding-block:48px"><p class="notice error">處理 PDF 的元件沒有載入成功，請確認網路連線後重新整理頁面。</p></div>`;
} else {
  route();
  getDownloads();
}
})();
